<style>
/* Layout: one-screen phone app; a white drawing canvas, a word prompt box, and a flipbook reveal at the end */
:root {
  --bg: #1f0f18;
  --surface: #2b1621;
  --line: #4a2638;
  --fg: #fbeef3;
  --muted: #c49cad;
  --go: #ff6fae;
  --go-ink: #2b0e1e;
  --go-edge: #b8296b;
  --win: #3ee6c1;
  --hot: #ff4d6d;
  --paper: #f6f1e6;
  --paper-ink: #1b1726;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; flex: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 48px; line-height: 1; margin: 0; letter-spacing: .5px; }
h1 .t { background: linear-gradient(90deg, #ff4d6d, #ffd23f, #3ee6c1, #8ab4ff, #c38bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; line-height: 1.45; }
.block { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--fg); font-family: var(--body); }
.pill.code { font-family: var(--display); font-weight: 400; letter-spacing: .12em; color: var(--go); }
.pill.btn-pill { cursor: pointer; margin-left: auto; }
.pill.off { border-color: var(--hot); color: var(--hot); }

.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; font: 700 18px var(--body); user-select: text; -webkit-user-select: text; }
.input::placeholder { color: var(--muted); font-weight: 400; }
.input.code { font-family: var(--display); font-weight: 400; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 26px; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 18px var(--body); cursor: pointer; width: 100%; color: var(--fg); }
.btn.go { background: var(--go); color: var(--go-ink); box-shadow: 0 6px 0 var(--go-edge); }
.btn.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 12px 16px; font-size: 15px; }
.btn.auto { width: auto; }
.btn:disabled { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
:is(.btn, .chip, .input, .link, .pill, .react button):focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.rules ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.overlay { position: fixed; inset: 0; background: rgba(10,8,16,.8); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 20; }
.sheet { width: 100%; max-width: 480px; max-height: 90%; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

.roomcode { font-family: var(--display); font-size: 64px; letter-spacing: .14em; color: var(--go); line-height: 1; text-align: center; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; max-width: 100%; }
.player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.done { border-color: var(--win); }
.player.done::after { content: "✓"; color: var(--win); font-weight: 800; }
.player.wait { opacity: .55; }
.player.away { opacity: .35; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--paper-ink); flex: none; }

/* setup / word writing */
.qbox { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 14px 16px; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.qbox b { font-family: var(--display); font-weight: 400; }

/* drawing */
.canvas-wrap { background: var(--paper); border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); touch-action: none; line-height: 0; }
.canvas-wrap canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
.canvas-tools { display: flex; gap: 10px; }

/* timer */
.timer { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--win); border-radius: 4px; transition: width .25s linear; }
.timer.low i { background: var(--hot); }
.secs { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.secs.low { color: var(--hot); }

.sent { background: var(--surface); border: 2px dashed var(--win); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.sent .sw { width: 64px; height: 64px; border-radius: 16px; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); overflow: hidden; background: var(--paper); }
.sent .sw img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* reveal flipbook */
.flip-head { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.flip-head .who { font-family: var(--display); font-size: 22px; color: var(--go); }
.flip-stage { background: var(--paper); color: var(--paper-ink); border-radius: 24px; min-height: 220px; display: flex; align-items: center; justify-content: center; padding: 18px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
.flip-stage img { max-width: 100%; max-height: 260px; border-radius: 12px; }
.flip-stage .word { font-family: var(--display); font-size: clamp(24px, 8vw, 36px); text-align: center; text-wrap: balance; }
.flip-strip { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.flip-strip i { width: 22px; height: 22px; border-radius: 6px; background: var(--line); display: inline-block; }
.flip-strip i.seen { background: var(--go); }
.wait-note { text-align: center; color: var(--muted); font-weight: 600; padding: 8px; }
.foot { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.react { display: flex; justify-content: center; gap: 8px; }
.react button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 24px; width: 50px; height: 46px; cursor: pointer; }
.react button:active { transform: scale(.9); }
.floaty { position: fixed; bottom: 90px; font-size: 40px; pointer-events: none; z-index: 30; animation: floaty 2.2s ease-out forwards; }
@keyframes floaty { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { transform: translateY(-60vh); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop, .floaty { animation: none; } .timer i { transition: none; } }
</style>

<div class="app">
  <div class="hdr" id="hdr" hidden>
    <span class="pill code" id="hdrCode">ABCD</span>
    <span class="pill" id="hdrRound">Sala de espera</span>
    <span class="pill off" id="hdrNet" hidden>sem conexão</span>
    <button class="pill btn-pill" id="hdrRules" type="button">Regras</button>
  </div>
  <div id="main"></div>
  <div class="foot" id="foot" hidden><button class="link" id="sair" type="button">Sair da sala</button></div>
</div>
<div class="overlay" id="rulesSheet" hidden>
  <div class="sheet">
    <div class="top"><h2>Regras</h2><button class="btn ghost small auto" id="rulesClose" type="button">Fechar</button></div>
    <div class="rules" id="rulesFull"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ================= rules & data ================= */
const RULES_HTML = `
  <span class="label">Como joga</span>
  <ol>
    <li>Cada jogador entra numa sala pelo próprio celular. É preciso pelo menos <b>3 pessoas</b>.</li>
    <li>No início, cada um escreve uma <b>palavra ou frase secreta</b>. Essa é a semente de uma cadeia que vai passar por todo mundo, menos por quem escreveu.</li>
    <li>A cada rodada, você recebe a cadeia de outra pessoa e faz <b>só o próximo passo</b>: se o último passo foi uma palavra, você <b>desenha</b> essa palavra; se foi um desenho, você <b>escreve o que acha que é</b>. Você nunca vê o que veio antes do último passo.</li>
    <li>Quando a cadeia completa a volta, é hora da <b>revelação</b>: todo mundo assiste, passo a passo, como a ideia original foi se transformando (ou se perdendo) pelo caminho.</li>
    <li>Não tem pontuação — o jogo é sobre rir do resultado final de cada cadeia.</li>
  </ol>`;
const PALAVRAS = ["Jacaré de óculos escuro","Festa de aniversário debaixo d'água","Robô apaixonado por pizza","Girafa andando de patinete","Sereia dirigindo um ônibus","Dinossauro no salão de beleza","Fantasma com medo de escuro","Astronauta surfando numa onda","Polvo tocando bateria","Vaca voando de guarda-chuva","Cachorro usando terno no escritório","Palhaço consertando um computador","Bruxa pilotando um foguete","Elefante fazendo ioga","Pinguim num deserto de areia","Rei leão numa fila de banco","Unicórnio jogando futebol","Zumbi aprendendo a dançar balé","Coelho mágico perdendo o chapéu","Gato pirata com perna de pau","Tubarão de bicicleta","Múmia numa academia de ginástica","Monstro do lago tirando selfie","Panda fazendo churrasco","Ovelha surfista no Havaí","Boneco de neve na praia","Alienígena tentando pedir pizza","Avestruz escondendo a cabeça num balde","Esqueleto dançando forró","Super-herói com medo de aranha","Sapo cantando ópera","Mago fazendo bolo de chocolate","Camelo nadando numa piscina","Raposa jogando xadrez","Baleia tocando violão numa praia","Canguru pulando corda","Macaco pilotando um avião","Hipopótamo numa aula de balé","Corvo usando óculos de sol","Lontra surfando no rio"];
const EMOJIS = ["😂","🤯","🫣","🔥","🎨"];
const MIN_P = 3, MAX_P = 8;

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function rand(n) { try { const b = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n; do crypto.getRandomValues(b); while (b[0] >= lim); return b[0] % n; } catch { return Math.floor(Math.random() * n); } }
function uuid() { if (crypto.randomUUID) return crypto.randomUUID(); return [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, "0")).join(""); }
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ================= session ================= */
const CFG = window.TELE_CFG || {};
const sb = CFG.url && window.supabase ? window.supabase.createClient(CFG.url, CFG.key) : null;
let me = store.get("tele_me", null);
if (!me || !me.id) { me = { id: uuid(), nome: "" }; store.set("tele_me", me); }
let code = null, ch = null, E = null, H = null, online = new Set(), lastSeen = 0, viewKey = "", homeErr = "";
let desenho = { canvas: null, ctx: null, vazio: true, drawing: false };
let palavraEnviada = {}, respEnviada = {};

const isHost = () => !!H;
const rk = () => E.sid + ":" + E.rodada;
const jog = id => (E && E.jogadores.find(j => j.id === id)) || null;
const nomeDe = id => (jog(id) || {}).nome || "Alguém";
const COLORS = ["#ffd23f","#3ee6c1","#ff4d6d","#8ab4ff","#ff9f43","#c38bff","#7bed9f","#ff7eb6"];
const corDe = id => { const i = E ? (E.ordem || E.jogadores.map(j=>j.id)).indexOf(id) : 0; return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
const av = id => `<span class="av" style="background:${corDe(id)}">${esc(nomeDe(id).trim().charAt(0).toUpperCase() || "?")}</span>`;
const ativos = () => E ? E.jogadores.filter(j => j.id === E.host || online.has(j.id)) : [];

function send(t, data) { if (ch) ch.send({ type: "broadcast", event: "m", payload: { t, ...data } }); }
function conectar(c) {
  if (ch) sb.removeChannel(ch);
  online = new Set();
  ch = sb.channel("tele-" + c, { config: { broadcast: { self: false }, presence: { key: me.id } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload || {}))
    .on("presence", { event: "sync" }, () => { online = new Set(Object.keys(ch.presenceState())); render(); if (H) hostTick(); })
    .subscribe(st => {
      if (st === "SUBSCRIBED") { $("hdrNet").hidden = true; ch.track({ nome: me.nome }); if (H) publicar(); else send("join", { id: me.id, nome: me.nome }); }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") $("hdrNet").hidden = false;
    });
}
function onMsg(m) {
  if (m.t === "estado" && !H && m.E && typeof m.E === "object") {
    if (!E || m.E.v >= E.v || m.E.sid !== E.sid) {
      if (E && m.E.sid !== E.sid) limparLocal();
      E = m.E; lastSeen = Date.now(); render();
    }
  } else if (m.t === "react" && EMOJIS.includes(m.e)) floatEmoji(m.e);
  else if (H && m.t === "join") hostJoin(m.id, m.nome);
  else if (H && m.t === "palavra") hostPalavra(m.id, m.texto);
  else if (H && m.t === "passo") hostPasso(m.id, m.rodada, m.sid, m.conteudo);
  else if (H && m.t === "hello") publicar();
}
function limparLocal() { palavraEnviada = {}; respEnviada = {}; }
setInterval(() => {
  if (!code || H) return;
  if (!E || !jog(me.id)) send("join", { id: me.id, nome: me.nome });
  if (E && Date.now() - lastSeen > 9000) $("hdrNet").hidden = false; else if (E) $("hdrNet").hidden = true;
}, 1500);

/* ================= host ================= */
function hostSave() { store.set("tele_host_" + code, { E: H.E }); }
function publicar() { H.E.v++; hostSave(); E = H.E; send("estado", { E: H.E }); render(); }
setInterval(() => { if (H && ch) { send("estado", { E: H.E }); hostTick(); } }, 2000);
function hostJoin(id, nome) {
  if (typeof id !== "string" || id.length > 40) return;
  nome = String(nome || "").trim().slice(0, 16) || "Alguém";
  const j = H.E.jogadores.find(j => j.id === id);
  if (j) { if (j.nome === nome) return publicar(); j.nome = nome; }
  else { if (H.E.jogadores.length >= MAX_P) return; H.E.jogadores.push({ id, nome }); }
  publicar();
}
function hostPalavra(id, texto) {
  const e = H.E;
  if (e.fase !== "setup" || !jog(id)) return;
  texto = String(texto || "").trim().slice(0, 40);
  if (!texto) return;
  const c = e.cadeias.find(c => c.dono === id);
  if (!c || c.entradas.length) return;
  c.entradas.push({ autor: id, tipo: "palavra", conteudo: texto });
  if (!e.prontos.includes(id)) e.prontos.push(id);
  publicar();
}
function hostPasso(id, rodada, sid, conteudo) {
  const e = H.E;
  if (e.fase !== "rodada" || rodada !== e.rodada || sid !== e.sid || e.respondeu.includes(id)) return;
  const ci = e.atribuicoes[id];
  if (ci === undefined) return;
  const cadeia = e.cadeias[ci];
  const tipo = cadeia.entradas.length % 2 === 1 ? "desenho" : "palavra";
  conteudo = tipo === "desenho" ? String(conteudo || "").slice(0, 260000) : String(conteudo || "").trim().slice(0, 40);
  if (tipo === "desenho" && !conteudo) return;
  cadeia.entradas.push({ autor: id, tipo, conteudo: conteudo || "(silêncio)" });
  e.respondeu.push(id);
  publicar(); hostTick();
}
function comecar() {
  const e = H.E;
  e.jogadores = e.jogadores.filter(j => j.id === e.host || online.has(j.id));
  if (e.jogadores.length < MIN_P) return;
  e.ordem = e.jogadores.map(j => j.id);
  e.cadeias = e.ordem.map(id => ({ dono: id, entradas: [] }));
  e.prontos = [];
  e.sid = uuid().slice(0, 8);
  e.fase = "setup";
  e.prazo = Date.now() + 50000;
  limparLocal();
  publicar();
}
function preencherFaltantes() {
  const e = H.E, usadas = new Set();
  for (const c of e.cadeias) {
    if (!c.entradas.length) {
      let p; do { p = PALAVRAS[rand(PALAVRAS.length)]; } while (usadas.has(p) && usadas.size < PALAVRAS.length);
      usadas.add(p);
      c.entradas.push({ autor: c.dono, tipo: "palavra", conteudo: p });
    }
  }
}
function iniciarRodadas() {
  const e = H.E;
  preencherFaltantes();
  e.totalRodadas = e.ordem.length - 1;
  e.rodada = 0;
  proximaRodada();
}
function proximaRodada() {
  const e = H.E;
  e.rodada++;
  if (e.rodada > e.totalRodadas) return iniciarRevelacao();
  const n = e.ordem.length, atrib = {};
  for (let i = 0; i < n; i++) atrib[e.ordem[(i + e.rodada) % n]] = i;
  e.atribuicoes = atrib;
  e.respondeu = [];
  e.prazo = Date.now() + 90000;
  e.fase = "rodada";
  publicar();
}
function preencherRodadaFaltante() {
  const e = H.E;
  for (const id of e.ordem) {
    if (e.respondeu.includes(id)) continue;
    const ci = e.atribuicoes[id]; if (ci === undefined) continue;
    const cadeia = e.cadeias[ci];
    const tipo = cadeia.entradas.length % 2 === 1 ? "desenho" : "palavra";
    cadeia.entradas.push({ autor: id, tipo, conteudo: tipo === "palavra" ? "(ninguém arriscou um palpite)" : null });
    e.respondeu.push(id);
  }
}
function hostTick() {
  if (!H) return;
  const e = H.E;
  if (e.fase === "setup" && (Date.now() > e.prazo || e.prontos.length >= e.ordem.length)) { iniciarRodadas(); return; }
  if (e.fase === "rodada") {
    const todos = e.ordem.every(id => e.respondeu.includes(id));
    if (Date.now() > e.prazo || todos) { preencherRodadaFaltante(); proximaRodada(); }
  }
}
function iniciarRevelacao() {
  const e = H.E;
  e.fase = "revelacao";
  e.rev = { c: 0, i: 0 };
  publicar();
}
function revelarProximo() {
  const e = H.E, cadeia = e.cadeias[e.rev.c];
  if (e.rev.i + 1 < cadeia.entradas.length) e.rev.i++;
  else if (e.rev.c + 1 < e.cadeias.length) { e.rev.c++; e.rev.i = 0; }
  else { e.fase = "fim"; publicar(); return; }
  publicar();
}

/* ================= actions ================= */
function codigoNovo() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({ length: 4 }, () => L[rand(L.length)]).join(""); }
function entrarComo(c, host) {
  code = c; store.set("tele_sala", { code: c, host });
  history.replaceState(null, "", "?sala=" + c);
  if (host) {
    const salvo = store.get("tele_host_" + c, null);
    H = salvo && salvo.E ? salvo : { E: { v: 0, sid: uuid().slice(0, 8), host: me.id, fase: "lobby", rodada: 0, jogadores: [{ id: me.id, nome: me.nome }], ordem: [], cadeias: [], prontos: [], atribuicoes: {}, respondeu: [] } };
    const eu = H.E.jogadores.find(j => j.id === me.id); if (eu) eu.nome = me.nome;
    E = H.E;
  } else { H = null; E = null; }
  lastSeen = Date.now();
  conectar(c); render();
  if (!host) setTimeout(() => { if (code === c && !E) { sair(); erroHome(`Não achei a sala ${c}. Confira o código e se quem criou está com o jogo aberto.`); } }, 9000);
}
function sair() {
  if (ch) sb.removeChannel(ch);
  ch = null; code = null; E = null; H = null;
  store.del("tele_sala"); history.replaceState(null, "", location.pathname);
  viewKey = ""; render();
}
$("sair").onclick = sair;
function erroHome(m) { homeErr = m; viewKey = ""; render(); }

function initCanvas(el) {
  desenho.canvas = el; desenho.ctx = el.getContext("2d"); desenho.vazio = true; desenho.drawing = false;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = 300, h = 220;
  el.width = w * dpr; el.height = h * dpr; el.style.width = "100%"; el.style.aspectRatio = (w / h);
  const ctx = desenho.ctx; ctx.scale(dpr, dpr); ctx.fillStyle = "#f6f1e6"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#1b1726"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const pos = ev => { const r = el.getBoundingClientRect(); const x = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * w; const y = ((ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top) / r.height * h; return [x, y]; };
  const start = ev => { ev.preventDefault(); desenho.drawing = true; const [x, y] = pos(ev); ctx.beginPath(); ctx.moveTo(x, y); };
  const move = ev => { if (!desenho.drawing) return; ev.preventDefault(); const [x, y] = pos(ev); ctx.lineTo(x, y); ctx.stroke(); desenho.vazio = false; atualizarEnviarDesenho(); };
  const end = ev => { desenho.drawing = false; };
  el.addEventListener("pointerdown", start); el.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end); el.addEventListener("pointerleave", end);
}
function limparCanvas() {
  if (!desenho.ctx) return;
  const w = 300, h = 220;
  desenho.ctx.fillStyle = "#f6f1e6"; desenho.ctx.fillRect(0, 0, w, h);
  desenho.vazio = true; atualizarEnviarDesenho();
}
function atualizarEnviarDesenho() { const b = $("enviarDesenho"); if (b) b.disabled = desenho.vazio; }
function enviarPasso(conteudo) {
  const key = rk();
  if (respEnviada[key]) return;
  respEnviada[key] = true;
  if (H) hostPasso(me.id, E.rodada, E.sid, conteudo); else send("passo", { id: me.id, rodada: E.rodada, sid: E.sid, conteudo });
  if (navigator.vibrate) navigator.vibrate(25);
  viewKey = ""; render();
}

/* ================= render ================= */
function render() {
  const inRoom = !!code;
  $("hdr").hidden = !inRoom || !E; $("foot").hidden = !inRoom;
  if (!inRoom) return paint("home", viewHome);
  if (!E) return paint("wait", () => `<div class="block" style="align-items:center;text-align:center;justify-content:center;flex:1"><h2>Entrando na sala ${esc(code)}…</h2><p class="muted">Quem criou a sala precisa estar com o jogo aberto.</p></div>`);
  $("hdrCode").textContent = code;
  $("hdrRound").textContent = E.fase === "lobby" ? "Sala de espera" : E.fase === "setup" ? "Escrevendo" : E.fase === "rodada" ? `Rodada ${E.rodada} de ${E.totalRodadas}` : E.fase === "revelacao" ? "Revelação" : "Fim de jogo";
  const base = [E.sid, E.fase, E.rodada].join("|");
  if (E.fase === "lobby") return paint("lobby|" + E.v + "|" + [...online].sort().join(","), viewLobby);
  if (E.fase === "setup") { const key = base + "|" + (palavraEnviada[E.sid] ? "enviado" : "escrevendo") + "|" + E.prontos.length; paint(key, palavraEnviada[E.sid] ? viewSetupEnviado : viewSetup); return statusSetup(); }
  if (E.fase === "rodada") { const key = base + "|" + (respEnviada[rk()] ? "enviado" : "fazendo"); paint(key, respEnviada[rk()] ? viewRodadaEnviado : viewRodada); return statusRodada(); }
  if (E.fase === "revelacao") return paint("rev|" + E.rev.c + "|" + E.rev.i, viewRevelacao);
  if (E.fase === "fim") return paint("fim", viewFim);
}
function paint(key, fn) {
  if (key === viewKey) return;
  viewKey = key;
  $("main").innerHTML = fn();
  bind();
}
function statusSetup() {
  const el = $("status"); if (!el) return;
  const at = ativos();
  el.innerHTML = `<span class="label">${E.prontos.length} de ${at.length} já escreveram</span><div class="players">${at.map(j => `<span class="player ${E.prontos.includes(j.id) ? "done" : "wait"}">${av(j.id)}<span class="nm">${esc(j.nome)}</span></span>`).join("")}</div>`;
}
function statusRodada() {
  const el = $("status"); if (!el) return;
  const at = ativos();
  el.innerHTML = `<span class="label">${E.respondeu.length} de ${at.length} já terminaram essa rodada</span><div class="players">${at.map(j => `<span class="player ${E.respondeu.includes(j.id) ? "done" : "wait"}">${av(j.id)}<span class="nm">${esc(j.nome)}</span></span>`).join("")}</div>`;
}
function viewHome() {
  const salaUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
  return `
  <div class="block"><span class="label">Telefone sem fio desenhado</span><h1>Telestrations<span class="t"></span></h1>
  <p class="muted">Escreva uma ideia, outra pessoa desenha, outra adivinha, e assim por diante. No final, assista a cadeia completa e descubra o que sobrou da ideia original.</p></div>
  <div class="rules">${RULES_HTML}</div>
  <div class="field"><label class="label" for="nome">Seu nome</label><input class="input" id="nome" maxlength="16" autocomplete="nickname" placeholder="Como te chamam?" value="${esc(me.nome || "")}"></div>
  <div class="field"><label class="label" for="codigo">Entrar numa sala</label>
    <div class="join-row"><input class="input code" id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${/^[A-Z]{4}$/.test(salaUrl) ? salaUrl : ""}"><button class="btn go auto" id="entrar" type="button">Entrar</button></div></div>
  <button class="btn ghost" id="criar" type="button">Criar sala nova</button>
  ${homeErr ? `<p class="muted" style="color:var(--hot)">${esc(homeErr)}</p>` : ""}
  ${!sb ? `<p class="muted" style="color:var(--hot)">O jogo está sem conexão com o servidor.</p>` : ""}`;
}
function viewLobby() {
  const host = isHost(), at = ativos(), falta = Math.max(0, MIN_P - at.length);
  return `
  <div class="block" style="align-items:center;text-align:center"><span class="label">Código da sala</span><div class="roomcode">${esc(code)}</div>
  <button class="btn ghost small auto" id="share" type="button">Chamar a galera</button></div>
  <div class="block"><span class="label">Jogadores (${at.length})</span><div class="players">${E.jogadores.map(j => `<span class="player ${j.id === E.host || online.has(j.id) ? "" : "away"}">${av(j.id)}<span class="nm">${esc(j.nome)}${j.id === me.id ? " (você)" : ""}${j.id === E.host ? " 👑" : ""}</span></span>`).join("")}</div></div>
  <div class="grow">${host ? `<button class="btn go" id="comecar" type="button" ${falta ? "disabled" : ""}>${falta ? `Faltam ${falta} ${falta === 1 ? "pessoa" : "pessoas"}` : "Começar partida"}</button>${falta ? `<p class="muted" style="text-align:center">Telestrations precisa de pelo menos ${MIN_P} jogadores pra cadeia dar a volta.</p>` : ""}` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} começar…</p>`}</div>`;
}
function viewSetup() {
  return `<div class="block"><span class="label">${wavvyIcon('hand')} Sua palavra ou ideia secreta</span>
  <p class="muted">Escreva algo curto e divertido. Vai ser a semente de uma cadeia que passa por todo mundo, menos por você.</p></div>
  <div class="field"><input class="input" id="palavraInput" maxlength="40" placeholder="Ex: Jacaré de óculos escuro" autocomplete="off"></div>
  <button class="btn go" id="enviarPalavra" type="button">Enviar</button>
  <button class="link" id="sortear" type="button" style="align-self:center">Sortear uma ideia pra mim</button>
  <div class="block" id="status"></div>`;
}
function viewSetupEnviado() {
  return `<div class="sent pop"><div><b>Palavra enviada!</b><p class="muted">Esperando a galera terminar de escrever.</p></div></div>
  <div class="block" id="status"></div>`;
}
function entradaAtual() {
  const ci = E.atribuicoes[me.id]; if (ci === undefined) return null;
  const cadeia = E.cadeias[ci]; return cadeia.entradas[cadeia.entradas.length - 1];
}
function viewRodada() {
  const ant = entradaAtual();
  if (!ant) return `<div class="block" style="text-align:center"><p class="muted">Você está de folga nessa rodada.</p></div>`;
  const souDesenho = ant.tipo === "palavra";
  return `<div class="top"><span class="label">${souDesenho ? wavvyIcon('palette') + " Desenhe isso" : wavvyIcon('message-circle-question') + " O que você acha que é?"}</span><span class="secs" id="secs"></span></div>
  <div class="timer" id="timer"><i></i></div>
  ${souDesenho
    ? `<div class="qbox"><b>${esc(ant.conteudo)}</b></div>
       <div class="canvas-wrap"><canvas id="tela"></canvas></div>
       <div class="canvas-tools"><button class="btn ghost small auto" id="limpar" type="button">Limpar</button><button class="btn go" id="enviarDesenho" type="button" disabled>Enviar desenho</button></div>`
    : `<div class="canvas-wrap"><img src="${ant.conteudo}" alt="Desenho para adivinhar" style="display:block;width:100%"></div>
       <div class="field"><input class="input" id="palpiteInput" maxlength="40" placeholder="O que é isso?" autocomplete="off"></div>
       <button class="btn go" id="enviarPalpite" type="button">Enviar palpite</button>`}
  <div class="block" id="status"></div>
  ${isHost() ? `<button class="btn ghost small" id="encerrar" type="button">Encerrar a rodada agora</button>` : ""}`;
}
function viewRodadaEnviado() {
  const v = respEnviada[rk()];
  return `<div class="top"><span class="label">Enviado</span><span class="secs" id="secs"></span></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="sent pop"><div><b>Boa!</b><p class="muted">Esperando a galera terminar essa rodada.</p></div></div>
    <div class="block" id="status"></div>
    ${isHost() ? `<div class="grow"><button class="btn ghost small" id="encerrar" type="button">Encerrar a rodada agora</button></div>` : ""}`;
}
function viewRevelacao() {
  const cadeia = E.cadeias[E.rev.c], passo = cadeia.entradas[E.rev.i];
  if (E.rev.i === 0) setTimeout(confetti, 150);
  return `<div class="flip-head"><span class="label">Cadeia de ${esc(nomeDe(cadeia.dono))}${cadeia.dono === me.id ? " (a sua!)" : ""} · passo ${E.rev.i + 1} de ${cadeia.entradas.length}</span>
    <div class="who">${esc(nomeDe(passo.autor))}${passo.autor === me.id ? " (você)" : ""}</div></div>
    <div class="flip-stage pop">${passo.tipo === "palavra" ? `<div class="word">${esc(passo.conteudo)}</div>` : (passo.conteudo ? `<img src="${passo.conteudo}" alt="Desenho">` : `<div class="word muted">(sem desenho)</div>`)}</div>
    <div class="flip-strip">${E.cadeias.map((_, i) => `<i class="${i < E.rev.c ? "seen" : ""}" title="Cadeia ${i + 1}"></i>`).join("")}</div>
    <div class="react">${EMOJIS.map(e => `<button type="button" data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>
    <div class="grow">${isHost() ? `<button class="btn go" id="proximo" type="button">${E.rev.c === E.cadeias.length - 1 && E.rev.i === cadeia.entradas.length - 1 ? "Terminar revelação" : "Próximo passo"}</button>` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} passar o próximo passo…</p>`}</div>`;
}
function viewFim() {
  setTimeout(confetti, 200);
  return `<div class="block" style="text-align:center;align-items:center"><div class="label">🎉</div><h2>Todas as cadeias foram reveladas!</h2>
  <p class="muted">Espero que tenha rolado uma boa gargalhada. Bora de novo?</p></div>
  <div class="react">${EMOJIS.map(e => `<button type="button" data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>
  <div class="grow">${isHost() ? `<button class="btn go" id="denovo" type="button">Jogar de novo</button>` : `<p class="wait-note">${esc(nomeDe(E.host))} pode começar outra partida.</p>`}</div>`;
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const pegaNome = () => { const n = ($("nome").value || "").trim(); if (!n) { erroHome("Escreva seu nome antes."); return null; } me.nome = n.slice(0, 16); store.set("tele_me", me); homeErr = ""; return n; };
  on("criar", () => { if (!sb || !pegaNome()) return; entrarComo(codigoNovo(), true); });
  on("entrar", () => {
    if (!sb || !pegaNome()) return;
    const c = ($("codigo").value || "").trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(c)) return erroHome("O código tem 4 letras.");
    entrarComo(c, false);
  });
  const ci = $("codigo"); if (ci) ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z]/g, ""); };
  on("share", async () => {
    const url = location.origin + location.pathname + "?sala=" + code, text = `Bora jogar Telestrations! Sala ${code}`;
    try { if (navigator.share) { await navigator.share({ title: "Telestrations", text, url }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(`${text}: ${url}`); toast("Link copiado. Manda no grupo!"); } catch { toast(url); }
  });
  on("comecar", () => H && comecar());
  on("sortear", () => { const inp = $("palavraInput"); if (inp) inp.value = PALAVRAS[rand(PALAVRAS.length)]; });
  on("enviarPalavra", () => {
    const v = ($("palavraInput").value || "").trim();
    if (!v) return toast("Escreva alguma coisa primeiro.");
    palavraEnviada[E.sid] = true;
    if (H) hostPalavra(me.id, v); else send("palavra", { id: me.id, texto: v });
    viewKey = ""; render();
  });
  const tela = $("tela"); if (tela) initCanvas(tela);
  on("limpar", limparCanvas);
  on("enviarDesenho", () => { if (!desenho.vazio) enviarPasso(desenho.canvas.toDataURL("image/jpeg", .55)); });
  on("enviarPalpite", () => { const v = ($("palpiteInput").value || "").trim(); if (!v) return toast("Escreva um palpite."); enviarPasso(v); });
  on("encerrar", () => H && H.E.fase === "rodada" && (preencherRodadaFaltante(), proximaRodada()));
  on("proximo", () => H && revelarProximo());
  on("denovo", () => { if (H) { H.E.fase = "lobby"; H.E.rodada = 0; H.E.cadeias = []; H.E.prontos = []; publicar(); } });
  document.querySelectorAll("[data-react]").forEach(b => b.onclick = () => { floatEmoji(b.dataset.react); send("react", { e: b.dataset.react }); });
}

/* clocks: setup/round timers, auto-send when time runs out is handled host-side via hostTick deadlines */
setInterval(() => {
  if (!E) return;
  if (H) hostTick();
  const timerEl = $("timer"), secsEl = $("secs");
  if (!timerEl && !secsEl) return;
  let prazo = null, total = null;
  if (E.fase === "setup" && !palavraEnviada[E.sid]) { prazo = E.prazo; total = 50000; }
  else if (E.fase === "rodada") { prazo = E.prazo; total = 90000; }
  if (!prazo) return;
  const left = Math.max(0, prazo - Date.now()), low = left < 10000;
  if (timerEl) { timerEl.firstElementChild.style.width = Math.min(100, left / total * 100) + "%"; timerEl.classList.toggle("low", low); }
  if (secsEl) { secsEl.textContent = Math.ceil(left / 1000) + " s"; secsEl.classList.toggle("low", low); }
}, 200);

function floatEmoji(e) { const d = document.createElement("div"); d.className = "floaty"; d.textContent = e; d.style.left = (10 + Math.random() * 75) + "%"; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  cv.hidden = false;
  const ps = Array.from({ length: 150 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: Hh * .3, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: COLORS[rand(COLORS.length)] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, Hh);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, Hh); cv.hidden = true; }
  })(t0);
}
let lock = null;
async function wakeLock() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wakeLock(); if (code && !H) send("hello", {}); } });
document.addEventListener("click", wakeLock, { once: true });
$("rulesFull").innerHTML = RULES_HTML;
$("hdrRules").onclick = () => $("rulesSheet").hidden = false;
$("rulesClose").onclick = () => $("rulesSheet").hidden = true;
$("rulesSheet").onclick = e => { if (e.target.id === "rulesSheet") $("rulesSheet").hidden = true; };

const salva = store.get("tele_sala", null);
const daUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
if (sb && salva && salva.code && me.nome && (!daUrl || daUrl === salva.code)) entrarComo(salva.code, salva.host);
else render();
</script>
<script src="../../game-theme.js"></script></body>
</html>

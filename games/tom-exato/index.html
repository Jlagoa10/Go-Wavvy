<style>
/* Layout: one-screen phone app; a big swatch to memorize, three color sliders, and side-by-side result chips */
:root {
  --bg: #15121f;
  --surface: #221d31;
  --line: #3a3150;
  --fg: #f4effc;
  --muted: #a69dbd;
  --go: #ffd23f;
  --go-ink: #1c1606;
  --go-edge: #b8901a;
  --win: #3ee6c1;
  --hot: #ff4d6d;
  --paper: #f6f1e6;
  --paper-ink: #1b1726;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; flex: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 48px; line-height: 1; margin: 0; letter-spacing: .5px; }
h1 .t { background: linear-gradient(90deg, #ff4d6d, #ffd23f, #3ee6c1, #8ab4ff, #c38bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; line-height: 1.45; }
.block { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--fg); font-family: var(--body); }
.pill.code { font-family: var(--display); font-weight: 400; letter-spacing: .12em; color: var(--go); }
.pill.btn-pill { cursor: pointer; margin-left: auto; }
.pill.off { border-color: var(--hot); color: var(--hot); }

.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; font: 700 18px var(--body); user-select: text; -webkit-user-select: text; }
.input::placeholder { color: var(--muted); font-weight: 400; }
.input.code { font-family: var(--display); font-weight: 400; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 26px; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 18px var(--body); cursor: pointer; width: 100%; color: var(--fg); }
.btn.go { background: var(--go); color: var(--go-ink); box-shadow: 0 6px 0 var(--go-edge); }
.btn.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 12px 16px; font-size: 15px; }
.btn.auto { width: auto; }
.btn:disabled { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
:is(.btn, .chip, .input, .link, .pill, .react button):focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.rules ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.scale { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.scale b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--go); text-align: right; font-variant-numeric: tabular-nums; }
.overlay { position: fixed; inset: 0; background: rgba(10,8,16,.8); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 20; }
.sheet { width: 100%; max-width: 480px; max-height: 90%; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

.roomcode { font-family: var(--display); font-size: 64px; letter-spacing: .14em; color: var(--go); line-height: 1; text-align: center; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; max-width: 100%; }
.player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.done { border-color: var(--win); }
.player.done::after { content: "✓"; color: var(--win); font-weight: 800; }
.player.wait { opacity: .55; }
.player.away { opacity: .35; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--paper-ink); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 12px; font: 700 15px var(--body); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.chip small { font-weight: 400; color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--go); color: var(--go-ink); border-color: var(--go); }
.chip[aria-pressed="true"] small { color: #5a4a10; }
.chip:disabled { cursor: default; }
.chip:disabled:not([aria-pressed="true"]) { opacity: .5; }

/* memorize */
.memo { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.big-swatch { flex: 1; min-height: 360px; border-radius: 28px; position: relative; display: flex; align-items: flex-end; justify-content: space-between; padding: 18px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
.big-swatch .tag { background: rgba(0,0,0,.45); color: #fff; font-weight: 800; border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.big-swatch .cd { font-family: var(--display); font-size: 56px; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,.45); line-height: 1; }
.memo-bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; position: relative; }
.memo-bar i { position: absolute; inset: 0 auto 0 0; background: var(--fg); }

/* recreate */
.preview { height: 190px; border-radius: 24px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); display: flex; align-items: flex-end; justify-content: flex-end; padding: 12px; }
.preview .hex { background: rgba(0,0,0,.45); color: #fff; font-weight: 800; border-radius: 999px; padding: 6px 12px; font-size: 13px; letter-spacing: .06em; }
.slider { display: flex; flex-direction: column; gap: 8px; }
.slider .top b { font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; border-radius: 22px; margin: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; border-radius: 50%; background: transparent; border: 5px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.4); }
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: transparent; border: 5px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.5); }
input[type=range]:focus-visible { outline: 3px solid var(--win); outline-offset: 3px; }
.timer { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--win); border-radius: 4px; transition: width .25s linear; }
.timer.low i { background: var(--hot); }
.secs { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.secs.low { color: var(--hot); }
.qbox { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 14px 16px; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.scene-box { position: relative; border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); background: #2a2440; }
.scene-box .scene { display: block; width: 100%; height: auto; }
.scene-box .hex { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; font-weight: 800; border-radius: 999px; padding: 6px 12px; font-size: 13px; letter-spacing: .04em; }
.duo-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo-scenes figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.duo-scenes figcaption { color: var(--muted); font-size: 13px; font-weight: 700; text-align: center; }
.sent { background: var(--surface); border: 2px dashed var(--win); border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.sent .sw { width: 64px; height: 64px; border-radius: 16px; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }

/* results */
.target { border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 4px; min-height: 170px; justify-content: flex-end; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
.target .nm { font-family: var(--display); font-size: clamp(22px, 7vw, 30px); line-height: 1.1; text-wrap: balance; }
.target .hx { font-weight: 800; letter-spacing: .08em; opacity: .8; font-size: 14px; }
.target.ink-dark { color: #14111c; } .target.ink-light { color: #fff; }
.hero { background: var(--surface); border: 2px solid var(--go); border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.hero .e { font-size: 34px; line-height: 1; }
.hero b { display: block; font-size: 18px; }
.hero span { color: var(--muted); font-size: 14px; }
.rlist { display: flex; flex-direction: column; gap: 8px; }
.rrow { display: grid; grid-template-columns: 26px 56px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.rrow.best { border-color: var(--win); background: #123a33; }
.rrow .pos { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.duo { width: 56px; height: 40px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }
.rrow .who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rrow .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .who span { color: var(--muted); font-size: 13px; }
.rrow .sc { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; text-align: right; }
.rrow .sc small { display: block; font-family: var(--body); font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

.scores { display: flex; flex-direction: column; gap: 8px; }
.score { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.score .pos { font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.score .nm { font-weight: 700; min-width: 0; display: flex; align-items: center; gap: 8px; }
.score .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .gain { color: var(--win); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.score .tot { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.score .tot small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 700; text-align: right; }
.score.first { border-color: var(--go); }
.score.first .pos { color: var(--go); }
.score.me { background: #2b2540; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 10px; font: 800 14px var(--body); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
.podium { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.podium .crown { font-size: 64px; line-height: 1; }
.podium .who { font-family: var(--display); font-size: clamp(32px, 11vw, 48px); color: var(--go); word-break: break-word; line-height: 1.05; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.strip i { width: 30px; height: 30px; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }
.wait-note { text-align: center; color: var(--muted); font-weight: 600; padding: 8px; }
.foot { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.react { display: flex; justify-content: center; gap: 8px; }
.react button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 24px; width: 50px; height: 46px; cursor: pointer; }
.react button:active { transform: scale(.9); }
.floaty { position: fixed; bottom: 90px; font-size: 40px; pointer-events: none; z-index: 30; animation: floaty 2.2s ease-out forwards; }
@keyframes floaty { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { transform: translateY(-60vh); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop, .floaty { animation: none; } .timer i { transition: none; } }
</style>

<script>
/* ================= rules & settings ================= */
const RULES_HTML = `
  <span class="label">Como joga</span>
  <ol>
    <li><b>Rodada de imagem:</b> aparece um desenho com uma parte sem cor ou uma imagem de personagem em preto e branco. Recrie a cor pedida pelos controles. Nos personagens, sua escolha aparece na amostra ao lado; a imagem colorida é revelada no resultado.</li>
    <li><b>Rodada de memória 🧠:</b> uma cor aparece por poucos segundos e some. Recrie de memória.</li>
    <li>Para acertar a cor, mexa em <b>Tom</b>, <b>Saturação</b> e <b>Brilho</b>. O anfitrião escolhe se a partida tem só imagens, só memória ou as duas misturadas.</li>
    <li>Envie antes do tempo acabar. Se o tempo acabar, vale a cor que estiver na tela.</li>
    <li>No fim de cada rodada aparece a cor de cada um ao lado da original, a nota de todo mundo e quem chegou mais perto.</li>
    <li>Quem somar mais pontos nas rodadas vence a partida. O <b>ranking da sala</b> guarda vitórias e pontos de todas as partidas jogadas nessa sala.</li>
  </ol>
  <span class="label">Pontos por rodada (0 a 100)</span>
  <div class="scale">
    <b>100</b><span>cor idêntica</span>
    <b>90+</b><span>quase impossível de diferenciar</span>
    <b>70+</b><span>bem perto</span>
    <b>40+</b><span>mesma família de cor</span>
    <b>0</b><span>outra cor</span>
  </div>
  <p class="muted">A nota usa a diferença de cor que o olho humano percebe (padrão ΔE2000). Cada ponto de diferença tira 2 pontos da nota. Nas cores de personagens, a referência é aproximada.</p>`;
const NIVEIS = {
  escalada: { t: "📈 Escalada", d: "de 5 s até 1,5 s" },
  facil: { t: "🟢 Fácil", d: "5 s para memorizar", ver: 5, rec: 25 },
  medio: { t: "🟡 Médio", d: "3 s para memorizar", ver: 3, rec: 20 },
  dificil: { t: "🔴 Difícil", d: "1,5 s para memorizar", ver: 1.5, rec: 15 }
};
function tempos(nivel, rodada, total) {
  if (nivel !== "escalada") return NIVEIS[nivel] || NIVEIS.medio;
  const k = total > 1 ? (rodada - 1) / (total - 1) : 0;
  return { ver: Math.round((5 - 3.5 * k) * 10) / 10, rec: Math.round(25 - 10 * k) };
}
const COLORS = ["#ffd23f","#3ee6c1","#ff4d6d","#8ab4ff","#ff9f43","#c38bff","#7bed9f","#ff7eb6","#70d6ff","#e0c3a0","#b5f04a","#ffb3a7"];
const EMOJIS = ["😂","🤯","🫣","🔥","🎨"];
const MODOS = {
  misto: { t: "🔀 Misturado", d: "imagens e memória" },
  imagens: { t: "🖼️ Imagens", d: "cores famosas" },
  memoria: { t: "🧠 Memória", d: "cor aparece e some" }
};
/* Image rounds: the part with class "alvo" (fill) or "alvos" (stroke) is the one to paint. Drawings are original. */
const PERSONAGEM = x => `<rect width="320" height="200" fill="#2a2440"/><rect class="alvo" x="105" y="26" width="110" height="148" rx="32" fill="${x}"/><circle cx="140" cy="82" r="9" fill="#1b1726"/><circle cx="180" cy="82" r="9" fill="#1b1726"/><path d="M135 120 Q160 142 185 120" stroke="#1b1726" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const FUNDO = `<rect width="320" height="200" fill="#f3efe6"/>`;
const BR = (verde, amarelo) => `<rect ${verde === null ? 'class="alvo"' : ""} width="320" height="200" fill="${verde ?? "X"}"/><polygon ${amarelo === null ? 'class="alvo"' : ""} points="160,16 300,100 160,184 20,100" fill="${amarelo ?? "X"}"/><circle cx="160" cy="100" r="44" fill="#002776"/><path d="M118 94 Q160 80 202 104" stroke="#fff" stroke-width="7" fill="none"/>`;
const IMAGENS = [
  { p: "Qual a cor do losango da bandeira do Brasil?", nome: "Losango da bandeira do Brasil", cor: "#FFDF00", svg: x => BR("#009C3B", null).replace("X", x) },
  { p: "Qual o verde da bandeira do Brasil?", nome: "Verde da bandeira do Brasil", cor: "#009C3B", svg: x => BR(null, "#FFDF00").replace("X", x) },
  { p: "Qual a cor da bola da bandeira do Japão?", nome: "Bola da bandeira do Japão", cor: "#BC002D", svg: x => `<rect width="320" height="200" fill="#fff"/><circle class="alvo" cx="160" cy="100" r="60" fill="${x}"/>` },

<style>
/* Layout: one-screen phone app; every phone gets its own face-down card, everything else is shared */
:root {
  --bg: #15121f;
  --surface: #221d31;
  --line: #3a3150;
  --fg: #f4effc;
  --muted: #a69dbd;
  --go: #ffd23f;
  --go-ink: #1c1606;
  --go-edge: #b8901a;
  --win: #3ee6c1;
  --hot: #ff4d6d;
  --paper: #f6f1e6;
  --paper-ink: #1b1726;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; flex: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.02; margin: 0; letter-spacing: .5px; text-wrap: balance; }
h1 em { font-style: normal; color: var(--hot); }
h2 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.12; margin: 0; text-wrap: balance; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; line-height: 1.45; }
.block { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--fg); }
.pill.code { font-family: var(--display); font-weight: 400; letter-spacing: .12em; color: var(--go); }
.pill.off { border-color: var(--hot); color: var(--hot); }

.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; font: 700 18px var(--body); user-select: text; -webkit-user-select: text; }
.input:focus { border-color: var(--go); outline: none; }
.input::placeholder { color: var(--muted); font-weight: 400; }
.input.code { font-family: var(--display); font-weight: 400; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 26px; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

.btn { appearance: none; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 18px var(--body); cursor: pointer; width: 100%; color: var(--fg); }
.btn.go { background: var(--go); color: var(--go-ink); box-shadow: 0 6px 0 var(--go-edge); }
.btn.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
.btn.danger { background: var(--hot); color: #fff; box-shadow: 0 6px 0 #a3213a; }
.btn.danger:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3213a; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 12px 16px; font-size: 15px; }
.btn.auto { width: auto; }
.btn:disabled { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
:is(.btn, .opt, .input, .link, .chip, .card, .peek, .react button, .stepper button, .switch input):focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }

.how { display: grid; gap: 8px; }
.how div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; line-height: 1.4; }
.how .e { font-size: 24px; line-height: 1; flex: none; }

.roomcode { font-family: var(--display); font-size: 64px; letter-spacing: .14em; color: var(--go); line-height: 1; text-align: center; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; max-width: 100%; }
.player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.done { border-color: var(--win); }
.player.done::after { content: "✓"; color: var(--win); font-weight: 800; }
.player.wait { opacity: .55; }
.player.away { opacity: .35; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--paper-ink); flex: none; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.row > div:first-child { min-width: 0; }
.row .t { font-weight: 700; }
.row .s { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; flex: none; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 24px; font-weight: 800; cursor: pointer; }
.stepper button:disabled { opacity: .3; }
.stepper output { min-width: 32px; text-align: center; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch input:disabled { cursor: default; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.switch input:checked + span { background: var(--win); }
.switch input:checked + span::after { transform: translateX(22px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 10px 14px; font: 600 15px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--go); color: var(--go-ink); border-color: var(--go); }
.chip:disabled { cursor: default; }
.chip:disabled:not([aria-pressed="true"]) { opacity: .5; }

/* Flip card: impostor and innocent cards share colors, slots and motion */
.stage { perspective: 1200px; display: flex; min-height: 380px; }
.card { position: relative; flex: 1; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.8,.2,1); cursor: pointer; border-radius: 26px; }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 26px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
.back { background-color: var(--surface); background-image: radial-gradient(circle at 1px 1px, var(--line) 1.5px, transparent 0); background-size: 18px 18px; border: 2px solid var(--line); }
.back .q { font-family: var(--display); font-size: 120px; line-height: 1; color: var(--go); text-shadow: 0 6px 0 var(--go-edge); }
.back .tap { font-weight: 800; font-size: 18px; }
.front { transform: rotateY(180deg); }
.front, .peekbox { background: var(--paper); color: var(--paper-ink); }
.cf { display: contents; }
.cf .label { color: #6c6480; }
.cf .big { font-family: var(--display); font-size: clamp(30px, 10vw, 46px); line-height: 1.05; word-break: break-word; text-wrap: balance; }
.cf .box { background: #e9e2d2; border-radius: 14px; padding: 10px 16px; font-size: 18px; font-weight: 800; }
.cf .theme-tag { border: 2px solid currentColor; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.cf .note { font-size: 14px; opacity: .7; max-width: 28ch; line-height: 1.4; margin: 0; }

/* hold-to-peek */
.peek { border: 2px dashed var(--line); background: var(--surface); color: var(--fg); border-radius: 18px; padding: 14px; font: 800 16px var(--body); cursor: pointer; touch-action: none; width: 100%; }
.peek:active { border-color: var(--go); }
.peekwrap { position: fixed; inset: 0; z-index: 35; background: rgba(10, 8, 16, .82); display: grid; place-items: center; padding: 20px; pointer-events: none; }
.peekbox { width: min(420px, 100%); min-height: 340px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }

/* question card */
.qcard { background: var(--paper); color: var(--paper-ink); border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; border-top: 10px solid var(--go); }
.qcard .pair { font-size: 20px; font-weight: 600; line-height: 1.3; }
.qcard .pair b { font-family: var(--display); font-weight: 400; font-size: 26px; color: #8a4b00; }
.qcard .q { font-family: var(--display); font-size: clamp(22px, 7vw, 30px); line-height: 1.15; text-wrap: balance; }
.qcard .label { color: #6c6480; }
.you { background: var(--surface); border: 1px solid var(--go); border-radius: 14px; padding: 10px 14px; font-weight: 700; color: var(--go); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 16px; padding: 14px 10px; font: 800 17px var(--body); cursor: pointer; display: flex; align-items: center; gap: 8px; word-break: break-word; text-align: left; }
.opt[aria-pressed="true"] { border-color: var(--hot); background: #3a1a26; color: #fff; }

.sent { background: var(--surface); border: 2px dashed var(--go); border-radius: 20px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.sent .v { font-family: var(--display); font-size: 26px; color: var(--go); word-break: break-word; }

.intro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.intro .big-e { font-size: 88px; line-height: 1; }
.intro .name { font-family: var(--display); font-size: clamp(32px, 10vw, 48px); line-height: 1.05; color: var(--hot); text-wrap: balance; word-break: break-word; }

/* results */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.panel .v { font-family: var(--display); font-size: 26px; line-height: 1.1; word-break: break-word; }
.panel .v.word { color: var(--win); }
.verdict { font-family: var(--display); font-size: 30px; line-height: 1.1; }
.ok { color: var(--win); } .bad { color: var(--hot); }
.res { display: flex; flex-direction: column; gap: 8px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.ritem.imp { border-color: var(--hot); background: #2c1622; }
.ritem .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; }
.ritem .head > span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ritem .who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 600; }
.ritem .who .av { width: 22px; height: 22px; font-size: 11px; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; flex: none; }

.scores { display: flex; flex-direction: column; gap: 8px; }
.score { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.score .pos { font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.score .nm { font-weight: 700; min-width: 0; display: flex; align-items: center; gap: 8px; }
.score .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .gain { color: var(--win); font-weight: 800; font-size: 14px; }
.score .tot { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.score.first { border-color: var(--go); }
.score.first .pos { color: var(--go); }
.score.me { background: #2b2540; }

.timer { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--go); border-radius: 4px; transition: width .25s linear; }
.timer.low i { background: var(--hot); }
.secs { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.wait-note { text-align: center; color: var(--muted); font-weight: 600; padding: 8px; }
.foot { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

.react { display: flex; justify-content: center; gap: 8px; }
.react button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 24px; width: 50px; height: 46px; cursor: pointer; }
.react button:active { transform: scale(.9); }
.floaty { position: fixed; bottom: 90px; font-size: 40px; pointer-events: none; z-index: 30; animation: floaty 2.2s ease-out forwards; }
@keyframes floaty { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { transform: translateY(-60vh); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .pop, .floaty { animation: none; } .timer i { transition: none; } }
</style>

  if (!E || !jogando()) return null;
  if (H) return cartaDe(me.id);
  return carta && carta.sid === E.sid && carta.rodada === E.rodada ? carta.c : null;
}
function responder(v) {
  const k = E.sid + ":" + E.rodada + ":" + E.fase;
  const mudou = mine[k] !== undefined;
  mine[k] = v;
  pend = { rodada: E.rodada, sid: E.sid, fase: E.fase, v, changed: mudou };
  if (H) hostResp(me.id, pend); else send("resp", { id: me.id, ...pend });
  if (navigator.vibrate) navigator.vibrate(20);
  viewKey = ""; render();
}
const minha = () => E ? mine[E.sid + ":" + E.rodada + ":" + E.fase] : undefined;
const feito = () => minha() !== undefined || (E[LISTA[E.fase]] || []).includes(me.id);
function acao(a) {
  const m = { id: me.id, sid: E.sid, rodada: E.rodada, num: E.q.num, a };
  if (H) hostAcao(me.id, m); else send("acao", m);
}

function codigoNovo() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({ length: 4 }, () => L[rand(L.length)]).join(""); }
function entrarComo(c, host) {
  code = c; store.set("imp_sala", { code: c, host });
  history.replaceState(null, "", "?sala=" + c);
  if (host) {
    const salvo = store.get("imp_host_" + c, null);
    H = salvo && salvo.E ? salvo : novoHost();
    const eu = H.E.jogadores.find(j => j.id === me.id); if (eu) eu.nome = me.nome;
    E = H.E;
  } else { H = null; E = null; }
  carta = null; lastSeen = Date.now();
  conectar(c);
  render();
  if (!host) setTimeout(() => { if (code === c && !E) { sair(); erroHome(`Não achei a sala ${c}. Confira o código e se quem criou está com o jogo aberto.`); } }, 9000);
}
function sair() {
  if (ch) sb.removeChannel(ch);
  ch = null; code = null; E = null; H = null; pend = null; carta = null;
  store.del("imp_sala");
  history.replaceState(null, "", location.pathname);
  viewKey = ""; render();
}
$("sair").onclick = sair;
let homeErr = "";
function erroHome(m) { homeErr = m; viewKey = ""; render(); }

/* ================= render ================= */
const FASE = { carta: "Cartas", perguntas: "Perguntas", votacao: "Votação", chute: "Última chance", revelacao: "Resultado" };
function render() {
  const inRoom = !!code;
  $("hdr").hidden = !inRoom || !E; $("foot").hidden = !inRoom;
  if (!inRoom) return paint("home", viewHome);
  if (!E) return paint("wait", () => `<div class="intro"><div class="big-e">📡</div><h2>Entrando na sala ${esc(code)}…</h2><p class="muted">Quem criou a sala precisa estar com o jogo aberto.</p></div>`);
  $("hdrCode").textContent = code;
  $("hdrRound").textContent = E.fase === "lobby" ? "Sala de espera" : `Rodada ${E.rodada} · ${FASE[E.fase]}`;
  const base = [E.sid, E.rodada, E.fase].join("|");
  if (E.fase === "lobby") return paint("lobby|" + E.v + "|" + [...online].sort().join(","), viewLobby);
  if (!jogando()) return paint(base + "|fora|" + E.v, viewFora);
  if (E.fase === "carta") { paint(base + "|" + !!minhaCarta() + "|" + feito(), viewCarta); return status(); }
  if (E.fase === "perguntas") return paint(base + "|" + E.q.num + "|" + E.q.troca + "|" + E.q.text, viewPerguntas);
  if (E.fase === "votacao") { paint(base + "|" + feito() + "|" + JSON.stringify(minha() ?? "") + "|" + partic().join(), viewVotacao); return status(); }
  if (E.fase === "chute") { paint(base + "|" + feito(), viewChute); return status(); }
  if (E.fase === "revelacao") return paint(base, viewRevelacao);
}
function paint(key, fn) {
  if (key === viewKey) return;
  const focado = document.activeElement && document.activeElement.id;
  viewKey = key;
  $("main").innerHTML = fn();
  bind();
  if (focado && $(focado)) $(focado).focus();
}
function status() {
  const el = $("status"); if (!el) return;
  const lista = E[LISTA[E.fase]] || [];
  const quem = E.fase === "chute" ? E.pegos.filter(vivo) : partic();
  const verbo = E.fase === "carta" ? "já viram a carta" : E.fase === "votacao" ? "já votaram" : "já chutaram";
  el.innerHTML = `<span class="label">${quem.filter(id => lista.includes(id)).length} de ${quem.length} ${verbo}</span><div class="players">${quem.map(id => `<span class="player ${lista.includes(id) ? "done" : "wait"}">${av(id)}<span class="nm">${esc(nomeDe(id))}</span></span>`).join("")}</div>`;
}

function viewHome() {
  const salaUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
  return `
  <div class="block"><span class="label">IMPOSTOR FESTA · 3 A 15 JOGADORES</span><h1>Quem é o <em>Impostor</em>?</h1>
  <p class="muted">Cada um joga no seu celular. Todo mundo recebe a palavra secreta, menos o impostor, que precisa blefar para passar despercebido. Reúna pelo menos três pessoas e descubra quem está fingindo.</p></div>
  <div class="how">
    <div><span class="e">${wavvyIcon('eye-off')}</span><span>Cada celular mostra só a sua carta. Ninguém precisa passar o aparelho.</span></div>
    <div><span class="e">${wavvyIcon('message-circle-question')}</span><span>O jogo sorteia quem pergunta para quem. Responda sem entregar a palavra.</span></div>
    <div><span class="e">${wavvyIcon('users')}</span><span>Voto secreto no celular. Se pegarem o impostor, ele ainda pode chutar a palavra e virar o jogo.</span></div>
  </div>
  <div class="field"><label class="label" for="nome">Seu nome</label><input class="input" id="nome" maxlength="16" autocomplete="nickname" placeholder="Como te chamam?" value="${esc(me.nome || "")}"></div>
  <div class="field"><label class="label" for="codigo">Entrar numa sala</label>
    <div class="join-row"><input class="input code" id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${/^[A-Z]{4}$/.test(salaUrl) ? salaUrl : ""}"><button class="btn go auto" id="entrar" type="button">Entrar</button></div></div>
  <button class="btn ghost" id="criar" type="button">Criar sala nova</button>
  ${homeErr ? `<p class="muted" style="color:var(--hot)">${esc(homeErr)}</p>` : ""}
  ${!sb ? `<p class="muted" style="color:var(--hot)">O jogo está sem conexão com o servidor.</p>` : ""}`;
}
function viewLobby() {
  const host = isHost(), at = ativos(), c = E.cfg, mx = maxImp(Math.max(3, at.length)), dis = host ? "" : "disabled";
  const imp = Math.min(c.imp, mx);
  const temPlacar = E.jogadores.some(j => E.placar[j.id]);
  return `
  <div class="block" style="align-items:center;text-align:center"><span class="label">Código da sala</span><div class="roomcode">${esc(code)}</div>

  <div class="block"><span class="label">Jogadores (${at.length})</span><div class="players">${E.jogadores.map(j => `<span class="player ${vivo(j.id) ? "" : "away"}">${av(j.id)}<span class="nm">${esc(j.nome)}${j.id === me.id ? " (você)" : ""}${j.id === E.host ? " 👑" : ""}</span></span>`).join("")}</div></div>
  <div class="block"><span class="label">Tema</span><div class="chips">${THEMES.map(t => `<button type="button" class="chip" data-tema="${esc(t)}" aria-pressed="${c.tema === t}" ${dis}>${t === RANDOM ? wavvyIcon('sparkles') + ' Aleatório' : esc(t)}</button>`).join("")}</div></div>
  <div class="block">
    <div class="row"><div><div class="t">Impostores</div><div class="s">${c.secreto ? (imp === 1 ? "Aumente para sortear de 1 a 2 ou mais" : `Sorteia de 1 a ${imp} por rodada`) : imp === 1 ? "1 por rodada" : `${imp} por rodada`}</div></div>
      <div class="stepper"><button type="button" id="iMenos" aria-label="Menos impostores" ${host && imp > 1 ? "" : "disabled"}>−</button><output>${imp}</output><button type="button" id="iMais" aria-label="Mais impostores" ${host && imp < mx ? "" : "disabled"}>+</button></div></div>
    <div class="row"><div><div class="t">Quantidade secreta</div><div class="s">Ninguém sabe quantos impostores tem</div></div>
      <label class="switch"><input type="checkbox" id="secreto" aria-label="Quantidade secreta de impostores" ${c.secreto ? "checked" : ""} ${dis}><span></span></label></div>
    <div class="row"><div><div class="t">Impostor ganha dica</div><div class="s">Desligue para o modo difícil</div></div>
      <label class="switch"><input type="checkbox" id="dica" aria-label="Impostor ganha dica" ${c.dica ? "checked" : ""} ${dis}><span></span></label></div>
  </div>
  <p class="muted">Pontos: votou num impostor +1. Impostor que escapa +3. Impostor pego que acerta a palavra +2.</p>
  ${temPlacar ? `<span class="label">Placar da sala</span>${scoresHTML()}${host ? `<button class="link" id="zerar" type="button">Zerar placar</button>` : ""}` : ""}
  <div class="grow">${host ? `<button class="btn go" id="comecar" type="button" ${at.length < 3 ? "disabled" : ""}>${at.length < 3 ? `Esperando gente entrar (mínimo 3)…` : "Distribuir as cartas"}</button>` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} começar…</p>`}</div>`;
}
function viewFora() {
  return `<div class="intro"><div class="big-e">⏳</div><h2>Rodada em andamento</h2><p class="muted">Você entra na próxima rodada. Enquanto isso, fica de olho em quem está blefando.</p></div>`;
}
function cartaHTML(c) {
  if (!c) return `<div class="cf"><span class="label">Carregando sua carta…</span></div>`;
  const t = c.imp
    ? ["Você é o", "IMPOSTOR", c.dica ? `Dica: ${c.dica}` : "Sem dica nessa rodada", "Finja que sabe a palavra e tente descobrir qual é pelas respostas dos outros."]
    : ["A palavra secreta é", c.palavra, "Você não é o impostor", "Responda sem entregar a palavra e fique de olho em quem parece perdido."];
  return `<div class="cf"><span class="theme-tag">${esc(c.tema)}</span><span class="label">${t[0]}</span><div class="big">${esc(t[1])}</div><div class="box">${esc(t[2])}</div><p class="note">${esc(t[3])}</p></div>`;
}
function peekHTML() { return `<button type="button" class="peek" id="peek">${wavvyIcon('eye-off')} Segure para ver sua carta</button>`; }
function viewCarta() {
  const c = minhaCarta();
  if (feito()) return `<div class="block"><span class="label">Sua carta</span><h2>Guardada. Ninguém mais vê.</h2><p class="muted">Quando todo mundo tiver visto, começam as perguntas.</p></div>
    ${peekHTML()}<div class="block" id="status"></div>
    ${isHost() ? `<div class="grow"><button class="btn ghost small" id="pular" type="button">Começar as perguntas agora</button></div>` : ""}`;
  const vir = virada === E.sid && c;
  return `<div class="top"><span class="label">Rodada ${E.rodada}</span><span class="label">Só você vê</span></div>
    <div class="stage"><div class="card ${vir ? "flipped" : ""}" id="card" role="button" tabindex="0" aria-expanded="${!!vir}" aria-label="${vir ? 'Toque para esconder a carta' : 'Toque para virar a carta'}">
      <div class="face back" aria-hidden="${!!vir}"><div class="q">?</div><div class="tap">${c ? "Toque para virar" : "Recebendo sua carta…"}</div></div>
      <div class="face front" aria-hidden="${!vir}">${cartaHTML(c)}</div></div></div>
    <div class="grow"><button class="btn go" id="vi" type="button" ${vir ? "" : "disabled"}>Já vi, esconder</button></div>
    <div class="block" id="status"></div>`;
}
function nomeOuVoce(id) { return id === me.id ? "Você" : esc(nomeDe(id)); }
function viewPerguntas() {
  const q = E.q, host = isHost();
  const papel = q.asker === me.id ? `<div class="you">Sua vez de perguntar para ${esc(nomeDe(q.target))}, em voz alta.</div>`
    : q.target === me.id ? `<div class="you">${esc(nomeDe(q.asker))} vai te perguntar. Responda sem falar a palavra.</div>` : "";
  return `<div class="top"><span class="label">Tema: ${esc(E.tema)}</span><span class="label">Pergunta ${q.num} · volta ${Math.ceil(q.num / Math.max(1, E.naRodada.length))}</span></div>
    <div class="qcard pop"><div class="pair"><b>${nomeOuVoce(q.asker)}</b> pergunta para <b>${q.target === me.id ? "você" : esc(nomeDe(q.target))}</b></div>
      <span class="label">Sugestão de pergunta</span><div class="q">${esc(q.text)}</div></div>
    ${papel}
    <div class="two"><button class="btn ghost small" id="outra" type="button">Outra pergunta</button><button class="btn ghost small" id="livre" type="button">Pergunta livre</button></div>
    ${peekHTML()}
    <div class="grow"><button class="btn go" id="proxima" type="button">Próxima pergunta</button>
    ${host ? `<button class="btn danger" id="votar" type="button">Abrir a votação</button>` : `<p class="wait-note">Quando a galera quiser votar, ${esc(nomeDe(E.host))} abre a votação.</p>`}</div>`;
}
function viewVotacao() {
  const v = minha(), alvos = partic().filter(id => id !== me.id);
  const dica = E.nImp == null ? "Pode ter mais de um impostor. Vote em quem você mais desconfia."
    : E.nImp > 1 ? `Tem ${E.nImp} impostores. Os ${E.nImp} mais votados são acusados.` : "Voto secreto. O mais votado é acusado.";
  return `<div class="block"><span class="label">Votação</span><h2>Quem é o impostor?</h2><p class="muted">${dica}</p></div>
    <div class="opts">${alvos.map(id => `<button type="button" class="opt" data-voto="${esc(id)}" aria-pressed="${v === id}">${av(id)}${esc(nomeDe(id))}</button>`).join("")}</div>
    ${feito() ? `<p class="muted">Voto enviado. Dá pra trocar até todo mundo votar.</p>` : ""}
    ${peekHTML()}
    <div class="block" id="status"></div>
    ${isHost() ? `<div class="grow"><button class="btn ghost small" id="pular" type="button">Encerrar a votação agora</button><button class="link" id="voltar" type="button">Voltar às perguntas</button></div>` : ""}`;
}
function viewChute() {
  const pegos = E.pegos, eu = pegos.includes(me.id);
  const head = `<div class="intro pop" style="flex:none"><div class="big-e">🎯</div><span class="label">${pegos.length > 1 ? "Impostores pegos" : "Impostor pego"}</span><div class="name">${pegos.map(id => nomeOuVoce(id)).join(" e ")}</div></div>`;
  const timer = `<div class="top"><span class="label">Última chance</span><span class="secs" id="secs"></span></div><div class="timer" id="timer"><i></i></div>`;
  if (eu && !feito()) return `${timer}${head}<p class="muted" style="text-align:center">Te pegaram! Se você acertar a palavra secreta, vira o jogo.</p>
    <input class="input" id="txt" maxlength="40" autocomplete="off" placeholder="Qual era a palavra?"><button class="btn go" id="chutar" type="button">Chutar</button>`;
  if (eu) return `${timer}${head}<div class="sent"><span class="label">Seu chute</span><div class="v">${esc(minha() ?? "enviado")}</div></div><div class="block" id="status"></div>`;
  return `${timer}${head}<p class="muted" style="text-align:center">${pegos.length > 1 ? "Eles estão" : "Está"} tentando adivinhar a palavra. Se acertar, vira o jogo.</p><div class="block" id="status"></div>
    ${isHost() ? `<div class="grow"><button class="btn ghost small" id="pular" type="button">Encerrar agora</button></div>` : ""}`;
}
function viewRevelacao() {
  const r = E.res || {}, imp = r.impostores || [], pegos = r.pegos || [], ac = r.acusados || [], many = imp.length > 1;
  const virou = pegos.filter(id => r.chutes[id] && r.chutes[id].ok);
  const inocentes = ac.filter(id => !imp.includes(id));
  let titulo, ok;
  if (virou.length) { titulo = `Pegaram, mas ${virou.map(nomeDe).map(esc).join(" e ")} acertou a palavra!`; ok = false; }
  else if (pegos.length === imp.length) { titulo = many ? "Pegaram todos os impostores!" : "Pegaram o impostor!"; ok = true; }
  else if (pegos.length) { titulo = "Pegaram só uma parte!"; ok = false; }
  else { titulo = many ? "Os impostores escaparam!" : "O impostor escapou!"; ok = false; }
  const sub = !ac.length ? "Ninguém votou." : inocentes.length ? `Acusaram ${inocentes.map(nomeDe).map(esc).join(" e ")}, que ${inocentes.length > 1 ? "eram inocentes" : "era inocente"}.` : `Tinha ${imp.length} ${many ? "impostores" : "impostor"} nessa rodada.`;
  if (ok) setTimeout(confetti, 300);
  const linhas = [...new Set([...imp, ...Object.keys(r.votos || {})])].filter(jog)
    .sort((a, b) => (imp.includes(b) - imp.includes(a)) || ((r.votos[b] || []).length - (r.votos[a] || []).length));
  const host = isHost();
  return `<div class="panel pop"><span class="label">Resultado</span><div class="verdict ${ok ? "ok" : "bad"}">${titulo}</div><p class="muted">${sub}</p></div>
    <div class="two"><div class="panel"><span class="label">Palavra secreta</span><div class="v word">${esc(r.palavra)}</div></div>
    <div class="panel"><span class="label">Dica do impostor</span><div class="v">${r.dica ? esc(r.dica) : "Sem dica"}</div></div></div>
    <span class="label">Votos</span>
    <div class="res">${linhas.map(id => { const vs = r.votos[id] || [], ch = r.chutes[id];
      return `<div class="ritem ${imp.includes(id) ? "imp" : ""}"><div class="head"><span>${av(id)}${esc(nomeDe(id))}</span><span class="tag ${imp.includes(id) ? "bad" : ac.includes(id) ? "bad" : "ok"}">${imp.includes(id) ? (pegos.includes(id) ? "Impostor pego" : "Impostor escapou") : ac.includes(id) ? "Inocente acusado" : "Inocente"}</span></div>
      <div class="who">${vs.length ? `${vs.length} ${vs.length === 1 ? "voto" : "votos"}: ${vs.map(v => `<span style="display:inline-flex;align-items:center;gap:4px">${av(v)}${esc(nomeDe(v))}</span>`).join("")}` : "nenhum voto"}</div>
      ${ch ? `<div class="who">chutou "${esc(ch.txt)}" <b class="${ch.ok ? "ok" : "bad"}">${ch.ok ? "acertou!" : "errou"}</b></div>` : ""}</div>`; }).join("")}</div>
    <div class="react">${EMOJIS.map(e => `<button type="button" data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>
    <span class="label">Placar</span>${scoresHTML(E.ganhos)}
    <div class="grow">${host ? `<button class="btn go" id="denovo" type="button">Nova rodada</button><button class="btn ghost" id="lobby" type="button">Mudar tema ou regras</button>` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} começar outra rodada…</p>`}</div>`;
}
function scoresHTML(g) {
  const rk = E.jogadores.map(j => j.id).sort((a, b) => (E.placar[b] || 0) - (E.placar[a] || 0));
  return `<div class="scores">${rk.map(id => { const p = E.placar[id] || 0, pos = rk.findIndex(o => (E.placar[o] || 0) === p) + 1;
    return `<div class="score ${pos === 1 && p > 0 ? "first" : ""} ${id === me.id ? "me" : ""}"><span class="pos">${pos}º</span><span class="nm">${av(id)}<span>${esc(nomeDe(id))}</span></span><span class="gain">${g && g[id] ? "+" + g[id] : ""}</span><span class="tot">${p}</span></div>`; }).join("")}</div>`;
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const entrar = host => {
    const n = ($("nome").value || "").trim(); if (!n) return erroHome("Escreva seu nome antes.");
    const c = host ? codigoNovo() : ($("codigo").value || "").trim().toUpperCase();
    if (!host && !/^[A-Z]{4}$/.test(c)) return erroHome("O código tem 4 letras.");
    if (!sb) return;
    me.nome = n.slice(0, 16); store.set("imp_me", me); homeErr = "";
    entrarComo(c, host);
  };
  on("criar", () => entrar(true));
  on("entrar", () => entrar(false));
  const ci = $("codigo"); if (ci) ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z]/g, ""); };
  on("share", async () => {
    const url = location.origin + location.pathname + "?sala=" + code, text = `Bora jogar Impostor Festa no Go Wavvy! Sala ${code}`;
    try { if (navigator.share) { await navigator.share({ title: "Impostor Festa · Go Wavvy", text, url }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(`${text}: ${url}`); toast("Link copiado. Manda no grupo!"); } catch { toast(url); }
  });

  /* lobby (host only) */
  const mx = () => maxImp(Math.max(3, ativos().length));
  document.querySelectorAll("[data-tema]").forEach(b => b.onclick = () => { if (H) { H.E.cfg.tema = b.dataset.tema; publicar(); } });
  on("iMenos", () => { if (H) { H.E.cfg.imp = Math.max(1, Math.min(H.E.cfg.imp, mx()) - 1); publicar(); } });
  on("iMais", () => { if (H) { H.E.cfg.imp = Math.min(mx(), H.E.cfg.imp + 1); publicar(); } });
  const sw = (id, k) => { const el = $(id); if (el) el.onchange = () => { if (H) { H.E.cfg[k] = el.checked; publicar(); } }; };
  sw("secreto", "secreto"); sw("dica", "dica");
  on("zerar", () => { if (H) { for (const id in H.E.placar) H.E.placar[id] = 0; publicar(); } });
  on("comecar", () => H && novaRodada());
  on("denovo", () => H && novaRodada());
  on("lobby", () => { if (H) { Object.assign(H.E, { fase: "lobby", naRodada: [], q: null, res: null }); publicar(); } });

  /* card */
  const card = $("card");
  if (card) {
    const flip = () => {
      if (!minhaCarta()) return;
      virada = virada === E.sid ? "" : E.sid;
      card.classList.toggle("flipped", virada === E.sid);
      card.setAttribute("aria-expanded", virada === E.sid);
      card.setAttribute("aria-label", virada === E.sid ? "Toque para esconder a carta" : "Toque para virar a carta");
      card.querySelector(".front").setAttribute("aria-hidden", virada !== E.sid);
      card.querySelector(".back").setAttribute("aria-hidden", virada === E.sid);
      $("vi").disabled = virada !== E.sid;
      if (navigator.vibrate) navigator.vibrate(30);
    };
    card.onclick = flip;
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  }
  on("vi", () => { virada = ""; responder(true); });
  const pk = $("peek");
  if (pk) {
    const ver = e => { if (e) e.preventDefault(); $("peekbox").innerHTML = cartaHTML(minhaCarta()); $("peekwrap").hidden = false; };
    pk.onpointerdown = ver; pk.onpointerup = esconder; pk.onpointercancel = esconder; pk.onpointerleave = esconder;
    pk.oncontextmenu = e => e.preventDefault();
    pk.onkeydown = e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) ver(e); };
    pk.onkeyup = e => { if (e.key === " " || e.key === "Enter") esconder(); };
    pk.onblur = esconder;
  }

  /* questions */
  on("proxima", () => acao("proxima"));
  on("outra", () => acao("outra"));
  on("livre", () => acao("livre"));
  on("votar", () => H && abrirVotacao());
  on("voltar", () => { if (H) { H.E.fase = "perguntas"; publicar(); } });
  on("pular", () => { if (!H) return; const f = H.E.fase; if (f === "carta") proximaPergunta(); else if (f === "votacao") apurar(); else if (f === "chute") revelar(); });

  /* vote + guess */
  document.querySelectorAll("[data-voto]").forEach(b => b.onclick = () => responder(b.dataset.voto));
  const txt = $("txt");
  const chutar = () => { const v = (txt.value || "").trim(); if (v) responder(v.slice(0, 40)); };
  on("chutar", chutar);
  if (txt) txt.onkeydown = e => { if (e.key === "Enter") chutar(); };
  document.querySelectorAll("[data-react]").forEach(b => b.onclick = () => { floatEmoji(b.dataset.react); send("react", { e: b.dataset.react }); });
}

/* the peek button can be repainted mid-hold, so release is caught anywhere */
function esconder() { $("peekwrap").hidden = true; $("peekbox").innerHTML = ""; }
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, esconder));
document.addEventListener("visibilitychange", esconder);

/* guess timer */
setInterval(() => {
  if (!E || !E.prazo) return;
  const left = Math.max(0, E.prazo - Date.now());
  const bar = $("timer"), secs = $("secs");
  if (bar && secs) {
    const low = left < 10000;
    bar.firstElementChild.style.width = Math.min(100, left / (CHUTE_S * 1000) * 100) + "%";
    bar.classList.toggle("low", low);
    secs.textContent = Math.ceil(left / 1000) + " s";
  }
  if (left === 0 && H) hostTick();
}, 250);

/* fun */
function floatEmoji(e) {
  const d = document.createElement("div"); d.className = "floaty"; d.textContent = e;
  d.style.left = (10 + Math.random() * 75) + "%"; document.body.appendChild(d); setTimeout(() => d.remove(), 2300);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  cv.hidden = false;
  const ps = Array.from({ length: 150 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: Hh * .3, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: COLORS[rand(COLORS.length)] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, Hh);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, Hh); cv.hidden = true; }
  })(t0);
}
let lock = null;
async function wakeLock() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wakeLock(); if (code && !H) send("hello", {}); } });
document.addEventListener("click", wakeLock, { once: true });

/* boot: come back to the same room after a reload */
const salva = store.get("imp_sala", null);
const daUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
if (sb && salva && salva.code && me.nome && (!daUrl || daUrl === salva.code)) entrarComo(salva.code, salva.host);
else render();
</script>

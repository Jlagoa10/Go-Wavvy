<style>
/* Layout: one-screen phone app; each minigame repaints the accent so every round feels different */
:root {
  --bg: #15121f;
  --surface: #221d31;
  --line: #3a3150;
  --fg: #f4effc;
  --muted: #a69dbd;
  --go: #ffd23f;
  --go-ink: #1c1606;
  --go-edge: #b8901a;
  --win: #3ee6c1;
  --hot: #ff4d6d;
  --paper: #f6f1e6;
  --paper-ink: #1b1726;
  --accent: #ffd23f;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
body[data-tipo="coletiva"] { --accent: #3ee6c1; }
body[data-tipo="provavel"] { --accent: #ff7eb6; }
body[data-tipo="nunca"]    { --accent: #ff9f43; }
body[data-tipo="mentira"]  { --accent: #c38bff; }
body[data-tipo="verdade"]  { --accent: #ffd23f; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; flex: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 50px; line-height: 1; margin: 0; letter-spacing: .5px; }
h1 em { font-style: normal; color: var(--hot); }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; line-height: 1.45; }
.block { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--fg); font-family: var(--body); }
.pill.code { font-family: var(--display); font-weight: 400; letter-spacing: .12em; color: var(--go); }
.pill.right { margin-left: auto; }
.pill.off { border-color: var(--hot); color: var(--hot); }

.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; font: 700 18px var(--body); user-select: text; -webkit-user-select: text; }
.input:focus { border-color: var(--accent); outline: none; }
.input::placeholder { color: var(--muted); font-weight: 400; }
.input.code { font-family: var(--display); font-weight: 400; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 26px; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

.btn { appearance: none; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 18px var(--body); cursor: pointer; width: 100%; color: var(--fg); }
.btn.go { background: var(--go); color: var(--go-ink); box-shadow: 0 6px 0 var(--go-edge); }
.btn.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 12px 16px; font-size: 15px; }
.btn.auto { width: auto; }
.btn:disabled { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
:is(.btn, .opt, .input, .link, .pill, .react button, .stepper button):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* minigame cards on the home screen */
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.game .e { font-size: 26px; line-height: 1; }
.game b { font-size: 15px; }
.game span { color: var(--muted); font-size: 13px; line-height: 1.35; }
.game:last-child:nth-child(odd) { grid-column: 1 / -1; }

.roomcode { font-family: var(--display); font-size: 64px; letter-spacing: .14em; color: var(--go); line-height: 1; text-align: center; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; max-width: 100%; }
.player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.done { border-color: var(--win); }
.player.done::after { content: "✓"; color: var(--win); font-weight: 800; }
.player.wait { opacity: .55; }
.player.away { opacity: .35; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--paper-ink); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 14px; font: 700 15px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--go); color: var(--go-ink); border-color: var(--go); }
.chip:disabled { cursor: default; }
.chip:disabled:not([aria-pressed="true"]) { opacity: .5; }

/* round intro */
.intro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.intro .big-e { font-size: 96px; line-height: 1; animation: wob 1s ease-in-out infinite alternate; }
@keyframes wob { from { transform: rotate(-8deg) scale(1); } to { transform: rotate(8deg) scale(1.08); } }
.intro .name { font-family: var(--display); font-size: clamp(36px, 11vw, 52px); line-height: 1; color: var(--accent); text-wrap: balance; }
.intro .rule { font-size: 18px; line-height: 1.45; max-width: 30ch; }
.intro .pts { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 15px; }
.count { font-family: var(--display); font-size: 40px; color: var(--muted); }

/* prompt card */
.card { background: var(--paper); color: var(--paper-ink); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 10px solid var(--accent); }
.card .label { color: #6c6480; }
.card .q { font-family: var(--display); font-size: clamp(21px, 6.6vw, 28px); line-height: 1.18; text-wrap: balance; }
.card .q .blank { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--paper-ink); }

.timer { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; transition: width .25s linear; }
.timer.low i { background: var(--hot); }
.secs { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.secs.low { color: var(--hot); }

.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 18px; padding: 16px 14px; font: 800 18px var(--body); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; word-break: break-word; }
.opt.center { justify-content: center; text-align: center; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.opt.huge { font-family: var(--display); font-weight: 400; font-size: 26px; padding: 34px 10px; flex-direction: column; gap: 6px; }
.opt.huge small { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); }
.vbtn { background: #123a33; border-color: var(--win); }
.mbtn { background: #3a1a26; border-color: var(--hot); }

.stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
.stepper button { width: 54px; height: 54px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 28px; font-weight: 800; cursor: pointer; }
.stepper output { min-width: 60px; text-align: center; font-family: var(--display); font-size: 44px; color: var(--accent); font-variant-numeric: tabular-nums; }

.sent { background: var(--surface); border: 2px dashed var(--accent); border-radius: 20px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.sent .v { font-family: var(--display); font-size: 26px; color: var(--accent); word-break: break-word; }

/* results */
.res { display: flex; flex-direction: column; gap: 10px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ritem.good { border-color: var(--win); background: #123a33; }
.ritem.bad { border-color: var(--hot); }
.ritem .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ritem .txt { font-family: var(--display); font-size: 20px; line-height: 1.15; word-break: break-word; min-width: 0; }
.ritem .n { font-family: var(--display); font-size: 22px; color: var(--accent); flex: none; }
.ritem .who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 600; }
.ritem .who .av { width: 24px; height: 24px; font-size: 11px; }
.tagline { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.tagline.g { color: var(--win); } .tagline.b { color: var(--hot); }
.hero { background: var(--paper); color: var(--paper-ink); border-radius: 24px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 6px; border-top: 10px solid var(--accent); }
.hero .label { color: #6c6480; }
.hero .big { font-family: var(--display); font-size: clamp(34px, 11vw, 52px); line-height: 1.05; word-break: break-word; }
.hero .sub { font-weight: 700; color: #4a4258; line-height: 1.4; }

.scores { display: flex; flex-direction: column; gap: 8px; }
.score { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.score .pos { font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.score .nm { font-weight: 700; min-width: 0; display: flex; align-items: center; gap: 8px; }
.score .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .gain { color: var(--win); font-weight: 800; font-size: 14px; }
.score .tot { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.score.first { border-color: var(--go); }
.score.first .pos { color: var(--go); }
.score.me { background: #2b2540; }
.podium { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.podium .crown { font-size: 64px; line-height: 1; }
.podium .who { font-family: var(--display); font-size: clamp(32px, 11vw, 48px); color: var(--go); word-break: break-word; line-height: 1.05; }
.award { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.award .e { font-size: 28px; line-height: 1; }
.award b { display: block; }
.award span { color: var(--muted); font-size: 14px; }
.wait-note { text-align: center; color: var(--muted); font-weight: 600; padding: 8px; }
.foot { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

.react { display: flex; justify-content: center; gap: 8px; }
.react button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 24px; width: 50px; height: 46px; cursor: pointer; }
.react button:active { transform: scale(.9); }
.floaty { position: fixed; bottom: 90px; font-size: 40px; pointer-events: none; z-index: 30; animation: floaty 2.2s ease-out forwards; }
@keyframes floaty { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { transform: translateY(-60vh); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop, .floaty, .intro .big-e { animation: none; } .timer i { transition: none; } }
</style>

function hostJoin(id, nome) {

  nome = String(nome || "").trim().slice(0, 16) || "Alguém";
  const j = H.E.jogadores.find(j => j.id === id);
  if (j) { if (j.nome === nome) return publicar(); j.nome = nome; }
  else { if (H.E.jogadores.length >= 12) return; H.E.jogadores.push({ id, nome }); H.E.placar[id] = H.E.placar[id] || 0; }
  publicar();
}
function valido(tipo, fase, v) {
  if (fase === "escolher") return typeof v === "string" && v.length < 20;
  if (tipo === "coletiva" || tipo === "mentira") return typeof v === "string" && v.trim().length > 0 && v.length <= 40;
  if (tipo === "provavel") return typeof v === "string" && !!H.E.jogadores.find(j => j.id === v);
  if (tipo === "nunca") return v && typeof v.fiz === "boolean" && Number.isInteger(v.chute) && v.chute >= 0 && v.chute <= 12;
  if (tipo === "verdade") return v === "V" || v === "M";

}
function hostResp(id, m) {
  const e = H.E;
  if (m.rodada !== e.rodada || m.sid !== e.sid || m.fase !== e.fase || !jog(id) || !valido(e.tipo, e.fase, m.v)) return;
  const bucket = e.fase === "escolher" ? H.priv.esc : H.priv.resp;
  if (e.tipo === "verdade" && bucket[id]) return;
  if (e.tipo === "provavel" && m.v === id) return;
  const ms = Number(m.ms);
  bucket[id] = { v: typeof m.v === "string" ? m.v.trim() : m.v, t: e.tipo === "verdade" && Number.isFinite(ms) && ms >= 0 ? ms : Date.now() };
  const lista = e.fase === "escolher" ? e.escolheu : e.respondeu;
  if (!lista.includes(id)) lista.push(id);
  publicar(); hostTick();
}
function montarSeq(total, nJog) {
  const tipos = Object.keys(JOGOS).filter(t => t !== "provavel" || nJog >= 3);
  const seq = [];
  while (seq.length < total) {
    let bloco = shuffle(tipos);
    if (seq.length && bloco[0] === seq[seq.length - 1]) bloco.push(bloco.shift());
    seq.push(...bloco);
  }
  return seq.slice(0, total);
}
function escolherPrompt(tipo) {
  const usados = H.E.usados[tipo] = H.E.usados[tipo] || [];
  let livres = P[tipo].map((_, i) => i).filter(i => !usados.includes(i));
  if (!livres.length) { H.E.usados[tipo] = []; livres = P[tipo].map((_, i) => i); }

function fimResponder() {
  const e = H.E;

  const real = P.mentira[e.prompt][1], nr = norm(real), grupos = {};

    const n = norm(r.v);
    if (n === nr) { e.sabidos.push(id); continue; }
    (grupos[n] = grupos[n] || { txt: r.v, autores: [] }).autores.push(id);
  }
  const ops = [{ txt: real, real: true, autores: [] }, ...Object.values(grupos).map(g => ({ ...g, real: false }))];
  if (ops.length < 2) return resultado();
  H.priv.mapa = {};
  e.opcoes = shuffle(ops).map(o => { const k = uuid().slice(0, 6); H.priv.mapa[k] = o; return { k, txt: o.txt, n: norm(o.txt) }; });

function resultado() {
  const e = H.E, R = H.priv.resp, g = {}, add = (id, k) => { if (k) g[id] = (g[id] || 0) + k; };
  let res = {};

    const grupos = {};

    const lista = Object.values(grupos).sort((a, b) => b.ids.length - a.ids.length);
    for (const gr of lista) for (const id of gr.ids) add(id, Math.min(3, gr.ids.length - 1));
    res = { grupos: lista };
  } else if (e.tipo === "provavel") {
    const votos = {};
    for (const [id, r] of Object.entries(R)) (votos[r.v] = votos[r.v] || []).push(id);
    const lista = Object.entries(votos).map(([alvo, quem]) => ({ alvo, quem })).sort((a, b) => b.quem.length - a.quem.length);
    const max = lista.length ? lista[0].quem.length : 0;
    const eleitos = lista.filter(x => x.quem.length === max).map(x => x.alvo);
    for (const x of lista) if (eleitos.includes(x.alvo)) for (const id of x.quem) add(id, 1);
    for (const id of eleitos) e.titulos[id] = (e.titulos[id] || 0) + 1;
    res = { votos: lista, eleitos };
  } else if (e.tipo === "nunca") {
    const sim = Object.values(R).filter(r => r.v.fiz).length;
    const chutes = Object.entries(R).map(([id, r]) => ({ id, chute: r.v.chute, d: Math.abs(r.v.chute - sim) })).sort((a, b) => a.d - b.d);
    for (const c of chutes) add(c.id, c.d === 0 ? 2 : c.d === 1 ? 1 : 0);
    res = { sim, total: Object.keys(R).length, chutes };

    const ops = (e.opcoes || []).map(o => ({ ...H.priv.mapa[o.k], escolhidos: [] }));
    for (const [id, r] of Object.entries(H.priv.esc)) {
      const o = H.priv.mapa[r.v]; if (!o) continue;
      const alvo = ops.find(x => x.txt === o.txt && x.real === o.real);
      if (alvo && !alvo.autores.includes(id)) alvo.escolhidos.push(id);
    }
    for (const o of ops) {
      if (o.real) o.escolhidos.forEach(id => add(id, 2));
      else o.autores.forEach(a => add(a, o.escolhidos.length));
    }
    (e.sabidos || []).forEach(id => add(id, 2));
    if (!ops.length) ops.push({ txt: P.mentira[e.prompt][1], real: true, autores: [], escolhidos: [] });
    res = { ops: ops.sort((a, b) => (b.real - a.real) || (b.escolhidos.length - a.escolhidos.length)), sabidos: e.sabidos || [] };
  } else if (e.tipo === "verdade") {
    const certo = P.verdade[e.prompt][1];
    const lista = Object.entries(R).map(([id, r]) => ({ id, v: r.v, t: r.t, ok: r.v === certo })).sort((a, b) => a.t - b.t);
    lista.filter(x => x.ok).forEach(x => add(x.id, 1));
    const rapido = lista.find(x => x.ok);
    if (rapido) add(rapido.id, 1);
    res = { certo, lista: lista.map(({ id, v, ok }) => ({ id, v, ok })), rapido: rapido ? rapido.id : null };
  }
  for (const id in g) e.placar[id] = (e.placar[id] || 0) + g[id];
  Object.assign(e, { fase: "resultado", prazo: null, res, ganhos: g, opcoes: null });
  publicar();
}

  <div class="field"><label class="label" for="codigo">Entrar numa sala</label>
    <div class="join-row"><input class="input code" id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${/^[A-Z]{4}$/.test(salaUrl) ? salaUrl : ""}"><button class="btn go auto" id="entrar" type="button">Entrar</button></div></div>
  <button class="btn ghost" id="criar" type="button">Criar sala nova</button>
  ${homeErr ? `<p class="muted" style="color:var(--hot)">${esc(homeErr)}</p>` : ""}
  ${!sb ? `<p class="muted" style="color:var(--hot)">O jogo está sem conexão com o servidor.</p>` : ""}`;
}
function viewLobby() {
  const host = isHost(), at = ativos();
  return `
  <div class="block" style="align-items:center;text-align:center"><span class="label">Código da sala</span><div class="roomcode">${esc(code)}</div>
  <button class="btn ghost small auto" id="share" type="button">Chamar a galera</button></div>
  <div class="block"><span class="label">Jogadores (${at.length})</span><div class="players">${E.jogadores.map(j => `<span class="player ${j.id === E.host || online.has(j.id) ? "" : "away"}">${av(j.id)}<span class="nm">${esc(j.nome)}${j.id === me.id ? " (você)" : ""}${j.id === E.host ? " 👑" : ""}</span></span>`).join("")}</div></div>
  <div class="block"><span class="label">Rodadas</span><div class="chips">${[5, 10, 15, 20].map(n => `<button type="button" class="chip" data-total="${n}" aria-pressed="${E.total === n}" ${host ? "" : "disabled"}>${n} rodadas</button>`).join("")}</div></div>
  <p class="muted">Os minijogos vêm sorteados e misturados. ${at.length < 3 ? "Com 3 pessoas ou mais entra também o Quem é Mais Provável." : ""}</p>
  <div class="grow">${host ? `<button class="btn go" id="comecar" type="button" ${at.length < 2 ? "disabled" : ""}>${at.length < 2 ? "Esperando mais gente entrar…" : "Começar a bagunça"}</button>` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} começar…</p>`}</div>`;
}
function viewIntro() {
  const j = JOGOS[E.tipo];
  return `<div class="intro pop"><span class="label">Rodada ${E.rodada} de ${E.total}</span><div class="big-e">${j.e}</div><div class="name">${j.nome}</div><p class="rule">${esc(j.regra)}</p><div class="pts">${esc(j.pts)}</div><div class="count" id="introCount"></div></div>`;
}
function promptHTML() {
  const t = E.tipo, i = E.prompt;
  if (t === "coletiva") return `<span class="label">🧠 Escreva</span><div class="q">${esc(P.coletiva[i])}</div>`;
  if (t === "provavel") return `<span class="label">👉 Quem é mais provável de…</span><div class="q">${esc(P.provavel[i])}?</div>`;
  if (t === "nunca") return `<span class="label">🙈 Quantos aqui…</span><div class="q">${esc(P.nunca[i])}?</div>`;
  if (t === "mentira") return `<span class="label">🤥 Complete</span><div class="q">${esc(P.mentira[i][0]).replace("____", '<span class="blank"></span>')}</div>`;
  return `<span class="label">⚡ Verdade ou mito?</span><div class="q">${esc(P.verdade[i][0])}</div>`;
}
function viewPlay() {
  const t = E.tipo, ok = respondi(), v = minha();
  let corpo = "";
  if (E.fase === "escolher") {
    const meu = norm(minha("responder") || "");
    const sabia = (E.sabidos || []).includes(me.id);
    corpo = sabia ? `<div class="sent"><span class="label">Você escreveu a resposta certa!</span><div class="v">+2 garantidos</div><span class="muted">Espere a galera escolher.</span></div>`
      : `<h2>Qual é a verdadeira?</h2><div class="opts">${E.opcoes.filter(o => o.n !== meu).map(o => `<button type="button" class="opt" data-pick="${esc(o.k)}" aria-pressed="${v === o.k}">${esc(o.txt)}</button>`).join("")}</div>${ok ? `<p class="muted">Pode trocar até o tempo acabar.</p>` : ""}`;
  } else if (t === "coletiva" || t === "mentira") {
    corpo = ok ? `<div class="sent"><span class="label">${t === "mentira" ? "Sua mentira" : "Sua resposta"}</span><div class="v">${esc(v ?? "enviada")}</div><button class="link" id="mudar" type="button">Mudar</button></div>`
      : `<input class="input" id="txt" maxlength="40" autocomplete="off" placeholder="${t === "mentira" ? "Invente algo que pareça real" : "Primeira coisa que vier na cabeça"}"><button class="btn go" id="enviarTxt" type="button">Enviar</button>`;
  } else if (t === "provavel") {
    corpo = `<div class="opts">${E.jogadores.filter(j => j.id !== me.id && (online.has(j.id) || j.id === E.host)).map(j => `<button type="button" class="opt" data-voto="${esc(j.id)}" aria-pressed="${v === j.id}">${av(j.id)}${esc(j.nome)}</button>`).join("")}</div>${ok ? `<p class="muted">Voto secreto. Pode trocar até o tempo acabar.</p>` : ""}`;
  } else if (t === "nunca") {
    const n = ativos().length;
    corpo = ok ? `<div class="sent"><span class="label">Enviado</span><div class="v">${v ? (v.fiz ? "Já fiz" : "Nunca fiz") + " · chute: " + v.chute : "ok"}</div><span class="muted">Ninguém vai saber quem respondeu o quê.</span><button class="link" id="mudar" type="button">Mudar</button></div>`
      : `<div class="opts two"><button type="button" class="opt center" data-fiz="1" aria-pressed="false">✋ Já fiz</button><button type="button" class="opt center" data-fiz="0" aria-pressed="false">🙅 Nunca fiz</button></div>
         <span class="label" style="text-align:center">Quantos de ${n} já fizeram?</span>
         <div class="stepper"><button type="button" id="cMenos" aria-label="Menos">−</button><output id="cNum">${Math.floor(n / 2)}</output><button type="button" id="cMais" aria-label="Mais">+</button></div>
         <button class="btn go" id="enviarNunca" type="button" disabled>Enviar</button>`;
  } else if (t === "verdade") {
    corpo = ok ? `<div class="sent"><span class="label">Sua resposta</span><div class="v">${v === "V" ? "Verdade" : v === "M" ? "Mito" : "enviada"}</div><span class="muted">Já era, não dá para trocar.</span></div>`
      : `<div class="opts two"><button type="button" class="opt huge vbtn" data-vm="V">Verdade<small>✅</small></button><button type="button" class="opt huge mbtn" data-vm="M">Mito<small>❌</small></button></div>`;
  }
  return `<div class="top"><span class="label">${JOGOS[t].e} ${JOGOS[t].nome}</span><span class="secs" id="secs"></span></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="card">${promptHTML()}</div>
    ${corpo}
    <div class="block" id="status"></div>
    ${isHost() ? `<div class="grow"><button class="btn ghost small" id="pular" type="button">Encerrar a vez agora</button></div>` : ""}`;
}
function quem(ids) { return ids.map(id => `<span style="display:inline-flex;align-items:center;gap:4px">${av(id)}${esc(nomeDe(id))}</span>`).join(""); }
function viewResultado() {
  const t = E.tipo, r = E.res || {}, g = E.ganhos || {};
  let corpo = "";
  if (t === "coletiva") {
    corpo = `<div class="card">${promptHTML()}</div><div class="res">${(r.grupos || []).map(gr => `<div class="ritem ${gr.ids.length > 1 ? "good" : ""}"><div class="head"><span class="txt">${esc(gr.txt)}</span><span class="n">${gr.ids.length}x</span></div><div class="who">${quem(gr.ids)}</div>${gr.ids.length > 1 ? `<span class="tagline g">Mentes conectadas: +${Math.min(3, gr.ids.length - 1)} cada</span>` : `<span class="tagline b">Pensou sozinho</span>`}</div>`).join("") || `<p class="muted">Ninguém respondeu.</p>`}</div>`;
  } else if (t === "provavel") {
    const el = r.eleitos || [];
    corpo = `<div class="hero"><span class="label">Mais provável de ${esc(P.provavel[E.prompt])}</span><div class="big">${el.length ? el.map(nomeDe).map(esc).join(" e ") : "Ninguém"}</div>${el.length ? `<div class="sub">👑 eleito pela galera</div>` : ""}</div>
      <div class="res">${(r.votos || []).map(x => `<div class="ritem ${el.includes(x.alvo) ? "good" : ""}"><div class="head"><span class="txt" style="display:flex;align-items:center;gap:8px">${av(x.alvo)}${esc(nomeDe(x.alvo))}</span><span class="n">${x.quem.length} ${x.quem.length === 1 ? "voto" : "votos"}</span></div><div class="who">votos de: ${quem(x.quem)}</div></div>`).join("")}</div>`;
  } else if (t === "nunca") {
    corpo = `<div class="hero"><span class="label">${esc(P.nunca[E.prompt])}?</span><div class="big">${r.sim} de ${r.total}</div><div class="sub">${r.sim === 0 ? "Ninguém aqui! Santos." : r.sim === r.total ? "Todo mundo! Que turma." : "já fizeram. Quem será? 👀"}</div></div>
      <div class="res">${(r.chutes || []).map(c => `<div class="ritem ${c.d === 0 ? "good" : ""}"><div class="head"><span class="txt" style="display:flex;align-items:center;gap:8px">${av(c.id)}${esc(nomeDe(c.id))}</span><span class="n">chutou ${c.chute}</span></div>${c.d === 0 ? `<span class="tagline g">Na mosca: +2</span>` : c.d === 1 ? `<span class="tagline g">Quase: +1</span>` : ""}</div>`).join("")}</div>`;
  } else if (t === "mentira") {
    corpo = `<div class="card">${promptHTML()}</div><div class="res">${(r.ops || []).map(o => `<div class="ritem ${o.real ? "good" : o.escolhidos.length ? "bad" : ""}"><div class="head"><span class="txt">${esc(o.txt)}</span><span class="tagline ${o.real ? "g" : "b"}">${o.real ? "✅ verdade" : "🤥 mentira"}</span></div>
      ${!o.real ? `<div class="who">de ${quem(o.autores)}</div>` : ""}
      <div class="who">${o.escolhidos.length ? (o.real ? "acertaram: " : "caíram: ") + quem(o.escolhidos) : (o.real ? "ninguém achou a verdade" : "ninguém caiu")}</div></div>`).join("")}
      ${(r.sabidos || []).length ? `<div class="ritem good"><span class="tagline g">Escreveu a verdade de cara: +2</span><div class="who">${quem(r.sabidos)}</div></div>` : ""}</div>`;
  } else if (t === "verdade") {
    const f = P.verdade[E.prompt];
    corpo = `<div class="hero"><span class="label">${esc(f[0])}</span><div class="big">${r.certo === "V" ? "✅ Verdade" : "❌ Mito"}</div><div class="sub">${esc(f[2])}</div></div>
      <div class="res">${(r.lista || []).map(x => `<div class="ritem ${x.ok ? "good" : "bad"}"><div class="head"><span class="txt" style="display:flex;align-items:center;gap:8px">${av(x.id)}${esc(nomeDe(x.id))}</span><span class="tagline ${x.ok ? "g" : "b"}">${x.ok ? (r.rapido === x.id ? "⚡ mais rápido +2" : "acertou +1") : "errou"}</span></div></div>`).join("") || `<p class="muted">Ninguém respondeu a tempo.</p>`}</div>`;
  }
  return `<div class="top"><span class="label">${JOGOS[t].e} ${JOGOS[t].nome}</span></div>${corpo}
    <div class="react">${EMOJIS.map(e => `<button type="button" data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>
    <span class="label">Placar</span>${scoresHTML(g)}
    <div class="grow">${isHost() ? `<button class="btn go" id="proxima" type="button">${E.rodada >= E.total ? "Ver o campeão" : "Próxima rodada"}</button>` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))}…</p>`}</div>`;
}
function ranking() { return E.jogadores.map(j => j.id).sort((a, b) => (E.placar[b] || 0) - (E.placar[a] || 0)); }
function scoresHTML(g) {
  const rk = ranking();
  return `<div class="scores">${rk.map(id => { const p = E.placar[id] || 0, pos = rk.findIndex(o => (E.placar[o] || 0) === p) + 1;
    return `<div class="score ${pos === 1 && p > 0 ? "first" : ""} ${id === me.id ? "me" : ""}"><span class="pos">${pos}º</span><span class="nm">${av(id)}<span>${esc(nomeDe(id))}</span></span><span class="gain">${g && g[id] ? "+" + g[id] : ""}</span><span class="tot">${p}</span></div>`; }).join("")}</div>`;
}
function viewFim() {
  const rk = ranking(), top = rk.length ? E.placar[rk[0]] || 0 : 0, champs = rk.filter(id => (E.placar[id] || 0) === top);
  const tit = Object.entries(E.titulos || {}).sort((a, b) => b[1] - a[1]);
  const aw = [];
  if (tit.length) aw.push(["👑", "Celebridade da noite", `${esc(nomeDe(tit[0][0]))} foi o mais votado ${tit[0][1]}x no Quem é Mais Provável`]);
  if (rk.length > 1) aw.push(["🐢", "Lanterninha", `${esc(nomeDe(rk[rk.length - 1]))}, tem revanche?`]);
  setTimeout(confetti, 300);
  return `<div class="podium pop"><div class="crown">🏆</div><span class="label">Rei da bagunça</span><div class="who">${champs.map(nomeDe).map(esc).join(" e ")}</div><p class="muted">${champs.length > 1 ? "empataram" : "venceu"} com ${top} pontos</p></div>
    ${aw.map(([e, t, s]) => `<div class="award"><span class="e">${e}</span><div><b>${t}</b><span>${s}</span></div></div>`).join("")}
    <div class="react">${EMOJIS.map(e => `<button type="button" data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>
    ${scoresHTML()}
    <div class="grow">${isHost() ? `<button class="btn go" id="denovo" type="button">Jogar de novo</button>` : `<p class="wait-note">${esc(nomeDe(E.host))} pode começar outra partida.</p>`}</div>`;
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("criar", () => {
    const n = ($("nome").value || "").trim(); if (!n) return erroHome("Escreva seu nome antes.");
    if (!sb) return;
    me.nome = n.slice(0, 16); store.set("bag_me", me); homeErr = "";
    entrarComo(codigoNovo(), true);
  });
  on("entrar", () => {
    const n = ($("nome").value || "").trim(); if (!n) return erroHome("Escreva seu nome antes.");
    const c = ($("codigo").value || "").trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(c)) return erroHome("O código tem 4 letras.");
    if (!sb) return;
    me.nome = n.slice(0, 16); store.set("bag_me", me); homeErr = "";
    entrarComo(c, false);
  });
  const ci = $("codigo"); if (ci) ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z]/g, ""); };
  on("share", async () => {
    const url = location.origin + location.pathname + "?sala=" + code, text = `Bora jogar Bagunça! Sala ${code}`;
    try { if (navigator.share) { await navigator.share({ title: "Bagunça", text, url }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(`${text}: ${url}`); toast("Link copiado. Manda no grupo!"); } catch { toast(url); }
  });
  document.querySelectorAll("[data-total]").forEach(b => b.onclick = () => { if (H) { H.E.total = Number(b.dataset.total); publicar(); } });
  on("comecar", () => H && comecar());
  on("proxima", () => H && novaRodada());
  on("denovo", () => { if (H) { H.E.fase = "lobby"; H.E.rodada = 0; publicar(); } });
  on("pular", () => { if (!H) return; if (H.E.fase === "responder") fimResponder(); else if (H.E.fase === "escolher") resultado(); });
  on("mudar", () => { editando = E.sid + ":" + E.rodada + ":" + E.fase; viewKey = ""; render(); });
  if (E && E.fase === "responder" && E.tipo === "verdade" && document.querySelector("[data-vm]")) mostradoEm = performance.now();
  const txt = $("txt");
  const enviarTxt = () => { const v = (txt.value || "").trim(); if (!v) return; responder(v.slice(0, 40)); };
  on("enviarTxt", enviarTxt);
  if (txt) txt.onkeydown = e => { if (e.key === "Enter") enviarTxt(); };
  document.querySelectorAll("[data-voto]").forEach(b => b.onclick = () => responder(b.dataset.voto));
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => responder(b.dataset.pick));
  document.querySelectorAll("[data-vm]").forEach(b => b.onclick = () => responder(b.dataset.vm));
  let fiz = null;
  document.querySelectorAll("[data-fiz]").forEach(b => b.onclick = () => {
    fiz = b.dataset.fiz === "1";
    document.querySelectorAll("[data-fiz]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("enviarNunca").disabled = false;
  });
  const cn = $("cNum");
  on("cMenos", () => { cn.textContent = Math.max(0, Number(cn.textContent) - 1); });
  on("cMais", () => { cn.textContent = Math.min(ativos().length, Number(cn.textContent) + 1); });
  on("enviarNunca", () => { if (fiz === null) return; responder({ fiz, chute: Number(cn.textContent) }); });
  document.querySelectorAll("[data-react]").forEach(b => b.onclick = () => { floatEmoji(b.dataset.react); send("react", { e: b.dataset.react }); });
}

/* timer + intro countdown */
setInterval(() => {
  if (!E || !E.prazo) return;
  const left = Math.max(0, E.prazo - Date.now());
  const ic = $("introCount"); if (ic) ic.textContent = Math.ceil(left / 1000) || "Vai!";
  const bar = $("timer"), secs = $("secs");
  if (bar && secs) {
    const dur = (E.fase === "escolher" ? ESCOLHER_S : JOGOS[E.tipo].tempo) * 1000, low = left < 5000;
    bar.firstElementChild.style.width = Math.min(100, left / dur * 100) + "%";
    bar.classList.toggle("low", low); secs.classList.toggle("low", low);
    secs.textContent = Math.ceil(left / 1000) + " s";
  }
  if (left === 0 && H) hostTick();
}, 250);

/* fun */
function floatEmoji(e) {
  const d = document.createElement("div"); d.className = "floaty"; d.textContent = e;
  d.style.left = (10 + Math.random() * 75) + "%"; document.body.appendChild(d); setTimeout(() => d.remove(), 2300);
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  cv.hidden = false;
  const ps = Array.from({ length: 150 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: Hh * .3, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: COLORS[rand(COLORS.length)] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, Hh);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, Hh); cv.hidden = true; }
  })(t0);
}
let lock = null;
async function wakeLock() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wakeLock(); if (code && !H) send("hello", {}); } });
document.addEventListener("click", wakeLock, { once: true });

/* boot: come back to the same room after a reload */
const salva = store.get("bag_sala", null);
const daUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
if (sb && salva && salva.code && me.nome && (!daUrl || daUrl === salva.code)) entrarComo(salva.code, salva.host);
else render();
</script>

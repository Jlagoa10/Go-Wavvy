<style>
/* Layout: one-screen phone app; a hidden number card, a live reveal sequence, and a cooperative life counter */
:root {
  --bg: #1a140c;
  --surface: #2a2014;
  --line: #4a3b25;
  --fg: #f8f1e4;
  --muted: #bba988;
  --go: #ffb84d;
  --go-ink: #2b1a04;
  --go-edge: #b87c1a;
  --win: #3ee6c1;
  --hot: #ff4d6d;
  --paper: #f6f1e6;
  --paper-ink: #1b1726;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; flex: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 48px; line-height: 1; margin: 0; letter-spacing: .5px; }
h1 .t { background: linear-gradient(90deg, #ff4d6d, #ffd23f, #3ee6c1, #8ab4ff, #c38bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; line-height: 1.45; }
.block { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--fg); font-family: var(--body); }
.pill.code { font-family: var(--display); font-weight: 400; letter-spacing: .12em; color: var(--go); }
.pill.btn-pill { cursor: pointer; margin-left: auto; }
.pill.off { border-color: var(--hot); color: var(--hot); }

.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; font: 700 18px var(--body); user-select: text; -webkit-user-select: text; }
.input::placeholder { color: var(--muted); font-weight: 400; }
.input.code { font-family: var(--display); font-weight: 400; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 26px; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 18px var(--body); cursor: pointer; width: 100%; color: var(--fg); }
.btn.go { background: var(--go); color: var(--go-ink); box-shadow: 0 6px 0 var(--go-edge); }
.btn.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 12px 16px; font-size: 15px; }
.btn.auto { width: auto; }
.btn:disabled { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
:is(.btn, .chip, .input, .link, .pill, .react button):focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.rules ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.overlay { position: fixed; inset: 0; background: rgba(10,8,16,.8); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 20; }
.sheet { width: 100%; max-width: 480px; max-height: 90%; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

.roomcode { font-family: var(--display); font-size: 64px; letter-spacing: .14em; color: var(--go); line-height: 1; text-align: center; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; max-width: 100%; }
.player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.done { border-color: var(--win); }
.player.done::after { content: "✓"; color: var(--win); font-weight: 800; }
.player.wait { opacity: .55; }
.player.away { opacity: .35; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--paper-ink); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 12px; font: 700 15px var(--body); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.chip small { font-weight: 400; color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--go); color: var(--go-ink); border-color: var(--go); }
.chip[aria-pressed="true"] small { color: #4a2e05; }
.chip:disabled { cursor: default; }
.chip:disabled:not([aria-pressed="true"]) { opacity: .5; }

/* ito-specific */
.tema-box { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 14px 16px; font-size: 18px; line-height: 1.3; text-wrap: balance; font-weight: 700; }
.vidas { font-size: 24px; letter-spacing: 4px; }
.carta { flex: 1; min-height: 280px; border-radius: 28px; background: var(--surface); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px; }
.carta.revelada { border-color: var(--win); }
.carta .n { font-family: var(--display); font-size: 96px; line-height: 1; color: var(--go); }
.carta.revelada .n { color: var(--win); }
.seqrow { display: flex; flex-direction: column; gap: 8px; }
.seqitem { display: grid; grid-template-columns: 26px 38px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.seqitem.bad { border-color: var(--hot); background: #3a1620; }
.seqitem .pos { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.seqitem .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seqitem .num { font-family: var(--display); font-size: 24px; color: var(--go); font-variant-numeric: tabular-nums; }
.seqitem.bad .num { color: var(--hot); }
.erro-banner { background: #3a1620; border: 2px solid var(--hot); border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.erro-banner .e { font-size: 30px; line-height: 1; }
.win-banner { background: #123a33; border: 2px solid var(--win); border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.win-banner .e { font-size: 30px; line-height: 1; }
.sala-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.sala-stats .st { flex: 1; min-width: 100px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: center; }
.sala-stats .st b { display: block; font-family: var(--display); font-size: 22px; color: var(--go); }
.sala-stats .st span { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

.podium { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.podium .crown { font-size: 64px; line-height: 1; }
.podium .who { font-family: var(--display); font-size: clamp(28px, 10vw, 42px); color: var(--go); word-break: break-word; line-height: 1.05; }
.wait-note { text-align: center; color: var(--muted); font-weight: 600; padding: 8px; }
.foot { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.react { display: flex; justify-content: center; gap: 8px; }
.react button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 24px; width: 50px; height: 46px; cursor: pointer; }
.react button:active { transform: scale(.9); }
.floaty { position: fixed; bottom: 90px; font-size: 40px; pointer-events: none; z-index: 30; animation: floaty 2.2s ease-out forwards; }
@keyframes floaty { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { transform: translateY(-60vh); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop, .floaty { animation: none; } }
</style>

<div class="app">
  <div class="hdr" id="hdr" hidden>
    <span class="pill code" id="hdrCode">ABCD</span>
    <span class="pill" id="hdrRound">Sala de espera</span>
    <span class="pill off" id="hdrNet" hidden>sem conexão</span>
    <button class="pill btn-pill" id="hdrRules" type="button">Regras</button>
  </div>
  <div id="main"></div>

</div>
<div class="overlay" id="rulesSheet" hidden>
  <div class="sheet">
    <div class="top"><h2>Regras</h2><button class="btn ghost small auto" id="rulesClose" type="button">Fechar</button></div>
    <div class="rules" id="rulesFull"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ================= rules & settings ================= */
const RULES_HTML = `
  <span class="label">Como joga</span>
  <ol>
    <li>Todo mundo recebe em segredo um número de 1 a 100. Só você vê o seu.</li>
    <li>Aparece um tema (ex: "quão assustador é: palhaço"). Combinado o tema, cada um dá uma <b>dica falada</b> relacionada a esse tema que sugira se o seu número é alto ou baixo — <b>sem falar o número</b>.</li>
    <li>Conversando, o grupo tenta descobrir a ordem certa, do menor para o maior. Quando você acha que tem o <b>menor número que ainda falta revelar</b>, toque em "Revelar".</li>
    <li>Se o número revelado for realmente o menor entre os que faltam, a sequência continua. Se vier um número mais baixo que um já revelado antes, a ordem quebrou: o grupo perde uma vida nessa rodada.</li>
    <li>Rodada sem erro = rodada perfeita. O jogo acaba quando as vidas zeram ou quando todas as rodadas da partida terminam.</li>
    <li>É um jogo cooperativo: todo mundo ganha ou perde junto, sem placar individual.</li>
  </ol>
  <p class="muted">Jogue com o grupo conversando em voz alta — o app só guarda os números e a ordem revelada.</p>`;
const NIVEIS = {
  facil: { t: "🟢 Fácil", d: "3 vidas", vidas: 3 },
  medio: { t: "🟡 Médio", d: "2 vidas", vidas: 2 },
  dificil: { t: "🔴 Difícil", d: "1 vida", vidas: 1 }
};
const TOTAIS = [3, 5, 8];
const EMOJIS = ["😂","🤯","🫣","🔥","🎉"];
const COLORS = ["#ffd23f","#3ee6c1","#ff4d6d","#8ab4ff","#ff9f43","#c38bff","#7bed9f","#ff7eb6","#70d6ff","#e0c3a0","#b5f04a","#ffb3a7"];
const TEMAS = [
  "De 1 a 100, o quão assustador é: palhaço",
  "De 1 a 100, quão bom seria ter esse super-poder: invisibilidade",
  "De 1 a 100, quanta vergonha dá esse perrengue: tropeçar na rua vazia",
  "De 1 a 100, quão nojento é: catar a sujeira da privada",
  "De 1 a 100, o quanto você confiaria sua vida a: um pássaro",
  "De 1 a 100, quão difícil é: aprender a tocar violão",
  "De 1 a 100, quão épico seria um filme sobre: sua última viagem ao mercado",
  "De 1 a 100, quão picante é: pimenta biquinho",
  "De 1 a 100, o quanto um gato ama: você",
  "De 1 a 100, quão caro parece: um relógio de luxo falso",
  "De 1 a 100, quão constrangedor é: cantar no chuveiro e alguém ouvir",
  "De 1 a 100, quão útil é na vida real: saber resolver cubo mágico",
  "De 1 a 100, quão perigoso é: andar de patinete elétrico",
  "De 1 a 100, quão bom par romântico seria: você e um robô",
  "De 1 a 100, quão estranho é o hábito: comer pizza com ketchup",
  "De 1 a 100, quão provável é alienígenas existirem",
  "De 1 a 100, quão forte é o cheiro de: queijo coalho assado",
  "De 1 a 100, quão divertido é: montar móvel sem manual",
  "De 1 a 100, quão fofo é: uma capivara de pelúcia",
  "De 1 a 100, quão clichê é: comédia romântica de Natal",
  "De 1 a 100, quão loucura seria: pular de paraquedas sem treino",
  "De 1 a 100, quão irritante é: barulho de giz no quadro",
  "De 1 a 100, quão sortudo você é na vida",
  "De 1 a 100, quão épica seria uma batalha entre: um tubarão e um urso",
  "De 1 a 100, quão chato é: esperar o carregamento de um jogo",
  "De 1 a 100, quão bom seria morar em: uma casa na árvore",
  "De 1 a 100, quão dramático você fica quando está gripado",
  "De 1 a 100, quão bizarra é a combinação: manga com pimenta",
  "De 1 a 100, quão épico seria vencer: o chefão final de um jogo difícil",
  "De 1 a 100, quão assustador é: ficar preso num elevador",
  "De 1 a 100, quanta saudade dá: férias de infância",
  "De 1 a 100, quão difícil é não rir numa reunião séria"
];

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function rand(n) { try { const b = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n; do crypto.getRandomValues(b); while (b[0] >= lim); return b[0] % n; } catch { return Math.floor(Math.random() * n); } }
function uuid() { if (crypto.randomUUID) return crypto.randomUUID(); return [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, "0")).join(""); }
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= session ================= */
const CFG = window.ITO_CFG || {};
const sb = CFG.url && window.supabase ? window.supabase.createClient(CFG.url, CFG.key) : null;
let me = store.get("ito_me", null);
if (!me || !me.id) { me = { id: uuid(), nome: "" }; store.set("ito_me", me); }
let code = null, ch = null, E = null, H = null, online = new Set(), lastSeen = 0, viewKey = "", homeErr = "";
let pendRevelar = false;

const isHost = () => !!H;
const jog = id => (E && E.jogadores.find(j => j.id === id)) || null;
const nomeDe = id => (jog(id) || {}).nome || "Alguém";
const corDe = id => { const i = E ? E.jogadores.findIndex(j => j.id === id) : 0; return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
const av = id => `<span class="av" style="background:${corDe(id)}">${esc(nomeDe(id).trim().charAt(0).toUpperCase() || "?")}</span>`;
const ativos = () => E ? E.jogadores.filter(j => j.id === E.host || online.has(j.id)) : [];
const meuRevelado = () => !!(E && E.sequencia && E.sequencia.some(x => x.id === me.id));

function send(t, data) { if (ch) ch.send({ type: "broadcast", event: "m", payload: { t, ...data } }); }
function conectar(c) {
  if (ch) sb.removeChannel(ch);
  online = new Set();
  ch = sb.channel("ito-" + c, { config: { broadcast: { self: false }, presence: { key: me.id } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload || {}))
    .on("presence", { event: "sync" }, () => { online = new Set(Object.keys(ch.presenceState())); render(); })
    .subscribe(st => {
      if (st === "SUBSCRIBED") { $("hdrNet").hidden = true; ch.track({ nome: me.nome }); if (H) publicar(); else send("join", { id: me.id, nome: me.nome }); }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") $("hdrNet").hidden = false;
    });
}
function onMsg(m) {
  if (m.t === "estado" && !H && m.E && typeof m.E === "object") {
    if (!E || m.E.v >= E.v || m.E.sid !== E.sid) { E = m.E; lastSeen = Date.now(); render(); }
  } else if (m.t === "react" && EMOJIS.includes(m.e)) floatEmoji(m.e);
  else if (H && m.t === "join") hostJoin(m.id, m.nome);
  else if (H && m.t === "revelar") hostRevelar(m.id);
  else if (H && m.t === "hello") publicar();
}
setInterval(() => {
  if (!code || H) return;
  if (!E || !jog(me.id)) send("join", { id: me.id, nome: me.nome });
  if (pendRevelar && E) { if (meuRevelado() || E.fase !== "rodada") pendRevelar = false; else send("revelar", { id: me.id }); }
  if (E && Date.now() - lastSeen > 9000) $("hdrNet").hidden = false; else if (E) $("hdrNet").hidden = true;
}, 1500);

/* ================= host ================= */
function hostSave() { store.set("ito_host_" + code, { E: H.E, priv: H.priv }); }
function publicar() { H.E.v++; hostSave(); E = H.E; send("estado", { E: H.E }); render(); }
setInterval(() => { if (H && ch) send("estado", { E: H.E }); }, 2000);
function hostJoin(id, nome) {
  if (typeof id !== "string" || id.length > 40) return;
  nome = String(nome || "").trim().slice(0, 16) || "Alguém";
  const j = H.E.jogadores.find(j => j.id === id);
  if (j) { if (j.nome === nome) return publicar(); j.nome = nome; }
  else { if (H.E.jogadores.length >= 12) return; H.E.jogadores.push({ id, nome }); }
  publicar();
}
function escolherTema() {
  const e = H.E, usados = e.temasUsados = e.temasUsados || [];
  let livres = TEMAS.map((_, i) => i).filter(i => !usados.includes(i));
  if (!livres.length) { e.temasUsados = []; livres = TEMAS.map((_, i) => i); }
  const i = livres[rand(livres.length)];
  e.temasUsados.push(i);
  return TEMAS[i];
}
function comecar() {
  const e = H.E;
  e.jogadores = e.jogadores.filter(j => j.id === e.host || online.has(j.id));
  e.sid = uuid().slice(0, 8); e.rodada = 0; e.vidas = NIVEIS[e.nivel].vidas; e.vidasIniciais = NIVEIS[e.nivel].vidas;
  e.rodadasPerfeitas = 0; e.historicoRodadas = []; e.temasUsados = [];
  novaRodada();
}
function novaRodada() {
  const e = H.E;
  e.rodada++;
  if (e.rodada > e.totalRodadas) return fimDeJogo();
  const jogadoresAtivos = ativos();
  const numerosSorteados = shuffle(Array.from({ length: 100 }, (_, i) => i + 1)).slice(0, jogadoresAtivos.length);
  const numeros = {};
  jogadoresAtivos.forEach((j, i) => numeros[j.id] = numerosSorteados[i]);
  Object.assign(e, { fase: "rodada", tema: escolherTema(), numeros, sequencia: [], erro: null, forcada: false });
  publicar();
}
function checarFimRodada() {
  const e = H.E, at = ativos();
  if (e.fase !== "rodada") return;
  if (e.sequencia.length >= at.length) encerrarRodada();
}
function encerrarRodada() {
  const e = H.E, sucesso = !e.erro && !e.forcada;
  if (sucesso) e.rodadasPerfeitas++;

  e.fase = "resultado";
  publicar();
}
function hostRevelar(id) {
  const e = H.E;
  if (e.fase !== "rodada" || !jog(id) || !e.numeros[id] || e.sequencia.some(x => x.id === id)) return;
  const numero = e.numeros[id];
  if (e.sequencia.length && !e.erro) {
    const ultimo = e.sequencia[e.sequencia.length - 1];
    if (numero < ultimo.numero) { e.erro = { id, numero, contraId: ultimo.id, contraNumero: ultimo.numero }; e.vidas = Math.max(0, e.vidas - 1); }
  }
  e.sequencia.push({ id, numero });
  if (e.erro && e.sequencia.length < ativos().length) {
    /* mistake found: auto-reveal everyone else's card in true ascending order so the group can see the full picture */
    const restantes = ativos().filter(j => !e.sequencia.some(x => x.id === j.id)).map(j => ({ id: j.id, numero: e.numeros[j.id] })).sort((a, b) => a.numero - b.numero);
    e.sequencia.push(...restantes);
  }

  publicar();
}
function forcarFim() {
  const e = H.E;
  if (e.fase !== "rodada") return;
  const restantes = ativos().filter(j => !e.sequencia.some(x => x.id === j.id)).map(j => ({ id: j.id, numero: e.numeros[j.id] })).sort((a, b) => a.numero - b.numero);
  e.sequencia.push(...restantes);
  e.forcada = true;
  encerrarRodada();
}
function fimDeJogo() {
  const e = H.E;
  e.fase = "fim";
  const vitoriaFinal = e.vidas > 0;
  e.sala = e.sala || { partidas: 0, vitorias: 0, melhorSequencia: 0 };
  e.sala.partidas++;
  if (vitoriaFinal) e.sala.vitorias++;
  e.sala.melhorSequencia = Math.max(e.sala.melhorSequencia, e.rodadasPerfeitas);
  publicar();
}

/* ================= actions ================= */
function revelar() {
  if (!E || E.fase !== "rodada" || meuRevelado()) return;
  pendRevelar = true;
  if (H) hostRevelar(me.id); else send("revelar", { id: me.id });
  if (navigator.vibrate) navigator.vibrate(25);
  render();
}
function codigoNovo() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({ length: 4 }, () => L[rand(L.length)]).join(""); }
function entrarComo(c, host) {
  code = c; store.set("ito_sala", { code: c, host });
  history.replaceState(null, "", "?sala=" + c);
  if (host) {
    const salvo = store.get("ito_host_" + c, null);
    H = salvo && salvo.E ? salvo : { E: { v: 0, sid: uuid().slice(0, 8), host: me.id, fase: "lobby", nivel: "medio", totalRodadas: 5, rodada: 0, vidas: NIVEIS.medio.vidas, vidasIniciais: NIVEIS.medio.vidas, jogadores: [{ id: me.id, nome: me.nome }], tema: null, numeros: {}, sequencia: [], erro: null, forcada: false, rodadasPerfeitas: 0, historicoRodadas: [], temasUsados: [], sala: { partidas: 0, vitorias: 0, melhorSequencia: 0 } }, priv: {} };
    const eu = H.E.jogadores.find(j => j.id === me.id); if (eu) eu.nome = me.nome;
    E = H.E;
  } else { H = null; E = null; }
  lastSeen = Date.now();
  conectar(c); render();
  if (!host) setTimeout(() => { if (code === c && !E) { sair(); erroHome(`Não achei a sala ${c}. Confira o código e se quem criou está com o jogo aberto.`); } }, 9000);
}
function sair() {
  if (ch) sb.removeChannel(ch);
  ch = null; code = null; E = null; H = null; pendRevelar = false;
  store.del("ito_sala"); history.replaceState(null, "", location.pathname);
  viewKey = ""; render();
}
$("sair").onclick = sair;
function erroHome(m) { homeErr = m; viewKey = ""; render(); }

/* ================= render ================= */
function render() {
  const inRoom = !!code;
  $("hdr").hidden = !inRoom || !E; $("foot").hidden = !inRoom;
  if (!inRoom) return paint("home", viewHome);
  if (!E) return paint("wait", () => `<div class="carta" style="text-align:center"><h2>Entrando na sala ${esc(code)}…</h2><p class="muted">Quem criou a sala precisa estar com o jogo aberto.</p></div>`);
  $("hdrCode").textContent = code;
  $("hdrRound").textContent = E.fase === "lobby" ? "Sala de espera" : E.fase === "fim" ? "Fim de jogo" : `Rodada ${E.rodada} de ${E.totalRodadas}`;
  if (E.fase === "lobby") return paint("lobby|" + E.v + "|" + [...online].sort().join(","), viewLobby);
  if (E.fase === "rodada") return paint(["r", E.sid, E.rodada, E.sequencia.map(x => x.id).join(","), online.size].join("|"), viewRodada);
  if (E.fase === "resultado") return paint(["res", E.sid, E.rodada].join("|"), viewResultado);
  if (E.fase === "fim") return paint(["fim", E.sid].join("|"), viewFim);
}
function paint(key, fn) {
  if (key === viewKey) return;
  viewKey = key;
  $("main").innerHTML = fn();
  bind();
}
function vidasHTML(vidas, total) { return `<span class="vidas">${"❤️".repeat(Math.max(0, vidas))}${"🖤".repeat(Math.max(0, total - vidas))}</span>`; }
function viewHome() {
  const salaUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
  return `
  <div class="block"><span class="label">Jogo cooperativo de intuição</span><h1>I<span class="t">to</span></h1>
  <p class="muted">Cada um recebe um número secreto de 1 a 100. Sem falar o número, deem dicas e descubram juntos a ordem certa — do menor para o maior.</p></div>
  <div class="rules">${RULES_HTML}</div>
  <div class="field"><label class="label" for="nome">Seu nome</label><input class="input" id="nome" maxlength="16" autocomplete="nickname" placeholder="Como te chamam?" value="${esc(me.nome || "")}"></div>
  <div class="field"><label class="label" for="codigo">Entrar numa sala</label>
    <div class="join-row"><input class="input code" id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${/^[A-Z]{4}$/.test(salaUrl) ? salaUrl : ""}"><button class="btn go auto" id="entrar" type="button">Entrar</button></div></div>
  <button class="btn ghost" id="criar" type="button">Criar sala nova</button>
  ${homeErr ? `<p class="muted" style="color:var(--hot)">${esc(homeErr)}</p>` : ""}

}
function salaStatsHTML(sala) {

  return `<div class="sala-stats"><div class="st"><b>${sala.partidas}</b><span>Partidas</span></div><div class="st"><b>${sala.vitorias}</b><span>Vitórias</span></div><div class="st"><b>${sala.melhorSequencia}</b><span>Melhor sequência de rodadas perfeitas</span></div></div>`;
}
function viewLobby() {
  const host = isHost(), at = ativos();
  return `
  <div class="block" style="align-items:center;text-align:center"><span class="label">Código da sala</span><div class="roomcode">${esc(code)}</div>
  <button class="btn ghost small auto" id="share" type="button">Chamar a galera</button></div>
  <div class="block"><span class="label">Jogadores (${at.length})</span><div class="players">${E.jogadores.map(j => `<span class="player ${j.id === E.host || online.has(j.id) ? "" : "away"}">${av(j.id)}<span class="nm">${esc(j.nome)}${j.id === me.id ? " (você)" : ""}${j.id === E.host ? " 👑" : ""}</span></span>`).join("")}</div></div>

  <div class="block"><span class="label">Rodadas</span><div class="chips">${TOTAIS.map(n => `<button type="button" class="chip" data-total="${n}" aria-pressed="${E.totalRodadas === n}" ${host ? "" : "disabled"}>${n} rodadas</button>`).join("")}</div></div>
  <div class="block"><span class="label">Histórico da sala</span>${salaStatsHTML(E.sala)}</div>
  <div class="grow">${host ? `<button class="btn go" id="comecar" type="button" ${at.length < 2 ? "disabled" : ""}>Começar partida</button>${at.length < 2 ? `<p class="muted" style="text-align:center">Precisa de pelo menos 2 jogadores na sala.</p>` : ""}` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} começar…</p>`}</div>`;
}
function viewRodada() {

  ${!meu ? `<button class="btn go" id="revelar" type="button">Acho que tenho o menor! Revelar</button>` : ""}
  <div class="block"><span class="label">${revelados.length} de ${at.length} já revelaram</span>
  ${E.sequencia.length ? `<div class="seqrow">${E.sequencia.map((x, i) => `<div class="seqitem ${E.erro && x.id === E.erro.id ? "bad" : ""}"><span class="pos">${i + 1}º</span>${av(x.id)}<span class="nm">${esc(nomeDe(x.id))}${x.id === me.id ? " (você)" : ""}</span><span class="num">${x.numero}</span></div>`).join("")}</div>` : `<p class="muted">Ninguém revelou ainda nessa rodada.</p>`}
  ${faltam.length ? `<div class="players">${faltam.map(j => `<span class="player wait">${av(j.id)}<span class="nm">${esc(j.nome)}${j.id === me.id ? " (você)" : ""}</span></span>`).join("")}</div>` : ""}
  </div>
  ${isHost() ? `<button class="btn ghost small" id="forcar" type="button">Encerrar a rodada agora</button>` : ""}`;

function viewResultado() {
  const e = E, perfeita = !e.erro && !e.forcada, ultima = e.historicoRodadas[e.historicoRodadas.length - 1];

    ? `<div class="erro-banner"><span class="e">⏭️</span><div><b>Rodada encerrada manualmente</b><span>Não entrou na contagem de rodadas perfeitas.</span></div></div>`
    : perfeita
    ? `<div class="win-banner pop"><span class="e">🎯</span><div><b>Rodada perfeita!</b><span>A ordem saiu certinha, sem nenhum erro.</span></div></div>`
    : `<div class="erro-banner pop"><span class="e">💥</span><div><b>A ordem quebrou!</b><span>${esc(nomeDe(e.erro.id))} revelou ${e.erro.numero}, menor que ${e.erro.contraNumero} de ${esc(nomeDe(e.erro.contraId))}. O grupo perdeu uma vida.</span></div></div>`;
  return `${banner}
    <div class="top"><span class="label">Vidas do grupo</span>${vidasHTML(e.vidas, e.vidasIniciais)}</div>
    <span class="label">Ordem final da rodada</span>
    <div class="seqrow">${(ultima ? ultima.sequencia : e.sequencia).map((x, i) => `<div class="seqitem ${e.erro && x.id === e.erro.id ? "bad" : ""}"><span class="pos">${i + 1}º</span>${av(x.id)}<span class="nm">${esc(nomeDe(x.id))}</span><span class="num">${x.numero}</span></div>`).join("")}</div>
    <p class="muted" style="text-align:center">${e.rodadasPerfeitas} de ${e.rodada} ${e.rodada === 1 ? "rodada perfeita" : "rodadas perfeitas"} até agora.</p>
    <div class="react">${EMOJIS.map(em => `<button type="button" data-react="${em}" aria-label="Reagir ${em}">${em}</button>`).join("")}</div>
    <div class="grow">${isHost() ? `<button class="btn go" id="proxima" type="button">${e.vidas <= 0 || e.rodada >= e.totalRodadas ? "Ver resultado final" : "Próxima rodada"}</button>` : `<p class="wait-note">Esperando ${esc(nomeDe(e.host))} continuar…</p>`}</div>`;
}
function viewFim() {
  const vitoria = E.vidas > 0;
  setTimeout(vitoria ? confetti : () => {}, 300);
  return `<div class="podium pop"><div class="crown">${vitoria ? "🏆" : "💔"}</div><span class="label">${vitoria ? "O grupo venceu!" : "Fim de jogo"}</span><div class="who">${vitoria ? "Parabéns!" : "As vidas acabaram"}</div>
    <p class="muted">${E.rodadasPerfeitas} de ${E.totalRodadas} rodadas perfeitas${vitoria ? `, com ${E.vidas} de ${E.vidasIniciais} vida${E.vidasIniciais === 1 ? "" : "s"} restante${E.vidas === 1 ? "" : "s"}` : ""}.</p></div>
    <div class="react">${EMOJIS.map(em => `<button type="button" data-react="${em}" aria-label="Reagir ${em}">${em}</button>`).join("")}</div>
    <span class="label">Histórico da sala</span>${salaStatsHTML(E.sala)}
    <div class="grow">${isHost() ? `<button class="btn go" id="denovo" type="button">Jogar de novo</button>` : `<p class="wait-note">${esc(nomeDe(E.host))} pode começar outra partida.</p>`}</div>`;
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const pegaNome = () => { const n = ($("nome").value || "").trim(); if (!n) { erroHome("Escreva seu nome antes."); return null; } me.nome = n.slice(0, 16); store.set("ito_me", me); homeErr = ""; return n; };
  on("criar", () => { if (!sb || !pegaNome()) return; entrarComo(codigoNovo(), true); });
  on("entrar", () => {
    if (!sb || !pegaNome()) return;
    const c = ($("codigo").value || "").trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(c)) return erroHome("O código tem 4 letras.");
    entrarComo(c, false);
  });
  const ci = $("codigo"); if (ci) ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z]/g, ""); };
  on("share", async () => {
    const url = location.origin + location.pathname + "?sala=" + code, text = `Bora jogar Ito! Sala ${code}`;
    try { if (navigator.share) { await navigator.share({ title: "Ito", text, url }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(`${text}: ${url}`); toast("Link copiado. Manda no grupo!"); } catch { toast(url); }
  });
  document.querySelectorAll("[data-nivel]").forEach(b => b.onclick = () => { if (H) { H.E.nivel = b.dataset.nivel; publicar(); } });
  document.querySelectorAll("[data-total]").forEach(b => b.onclick = () => { if (H) { H.E.totalRodadas = Number(b.dataset.total); publicar(); } });
  on("comecar", () => H && comecar());
  on("revelar", revelar);
  on("forcar", () => H && forcarFim());
  on("proxima", () => H && novaRodada());
  on("denovo", () => { if (H) { H.E.fase = "lobby"; H.E.rodada = 0; H.E.vidas = NIVEIS[H.E.nivel].vidas; H.E.vidasIniciais = NIVEIS[H.E.nivel].vidas; H.E.rodadasPerfeitas = 0; H.E.historicoRodadas = []; H.E.sequencia = []; H.E.erro = null; H.E.forcada = false; publicar(); } });
  document.querySelectorAll("[data-react]").forEach(b => b.onclick = () => { floatEmoji(b.dataset.react); send("react", { e: b.dataset.react }); });
}

function floatEmoji(e) { const d = document.createElement("div"); d.className = "floaty"; d.textContent = e; d.style.left = (10 + Math.random() * 75) + "%"; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  cv.hidden = false;
  const ps = Array.from({ length: 150 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: Hh * .3, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: COLORS[rand(COLORS.length)] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, Hh);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, Hh); cv.hidden = true; }
  })(t0);
}
let lock = null;
async function wakeLock() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wakeLock(); if (code && !H) send("hello", {}); } });
document.addEventListener("click", wakeLock, { once: true });
$("rulesFull").innerHTML = RULES_HTML;
$("hdrRules").onclick = () => $("rulesSheet").hidden = false;
$("rulesClose").onclick = () => $("rulesSheet").hidden = true;
$("rulesSheet").onclick = e => { if (e.target.id === "rulesSheet") $("rulesSheet").hidden = true; };

const salva = store.get("ito_sala", null);
const daUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
if (sb && salva && salva.code && me.nome && (!daUrl || daUrl === salva.code)) entrarComo(salva.code, salva.host);
else render();
</script>

<style>
/* Layout: one-screen phone app; id-card grid of everyone's identity, your own card locked until you self-report */
:root {
  --bg: #120b23;
  --surface: #211735;
  --line: #43304f;
  --fg: #f6f1ff;
  --muted: #ab9fc4;
  --go: #7c8cff;
  --go-ink: #0d0f2b;
  --go-edge: #4b57c9;
  --win: #3ee6c1;
  --hot: #ff4d6d;
  --paper: #f6f1e6;
  --paper-ink: #1b1726;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; flex: 1; }
h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; margin: 0; letter-spacing: .5px; }
h1 .t { background: linear-gradient(90deg, #7c8cff, #c38bff, #ff8fd6, #3ee6c1); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); margin: 0; line-height: 1.45; }
.block { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }

.hdr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--fg); font-family: var(--body); }
.pill.code { font-family: var(--display); font-weight: 400; letter-spacing: .12em; color: var(--go); }
.pill.btn-pill { cursor: pointer; margin-left: auto; }
.pill.off { border-color: var(--hot); color: var(--hot); }

.field { display: flex; flex-direction: column; gap: 6px; }
.input { width: 100%; min-width: 0; background: var(--surface); border: 2px solid var(--line); color: var(--fg); border-radius: 14px; padding: 14px; font: 700 18px var(--body); user-select: text; -webkit-user-select: text; }
.input::placeholder { color: var(--muted); font-weight: 400; }
.input.code { font-family: var(--display); font-weight: 400; letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 26px; }
.join-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 18px; padding: 17px 20px; font: 800 18px var(--body); cursor: pointer; width: 100%; color: var(--fg); }
.btn.go { background: var(--go); color: var(--go-ink); box-shadow: 0 6px 0 var(--go-edge); }
.btn.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-edge); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 12px 16px; font-size: 15px; }
.btn.auto { width: auto; }
.btn:disabled { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 6px; }
:is(.btn, .chip, .input, .link, .pill, .react button):focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.rules ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.overlay { position: fixed; inset: 0; background: rgba(10,8,16,.8); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 20; }
.sheet { width: 100%; max-width: 480px; max-height: 90%; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }

.roomcode { font-family: var(--display); font-size: 58px; letter-spacing: .14em; color: var(--go); line-height: 1; text-align: center; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 700; max-width: 100%; }
.player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player.away { opacity: .35; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--paper-ink); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 10px 12px; font: 700 15px var(--body); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.chip small { font-weight: 400; color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--go); color: var(--go-ink); border-color: var(--go); }
.chip[aria-pressed="true"] small { color: #1a1e52; }
.chip:disabled { cursor: default; }
.chip:disabled:not([aria-pressed="true"]) { opacity: .5; }

/* id cards */
.deck { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.idcard { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 108px; justify-content: center; align-items: center; text-align: center; position: relative; }
.idcard.me { border-color: var(--go); background: linear-gradient(160deg, var(--surface), #1a1430); }
.idcard.me.found { border-color: var(--win); }
.idcard .who { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.idcard .nome { font-family: var(--display); font-size: 19px; line-height: 1.15; word-break: break-word; }
.idcard .lock { font-size: 26px; opacity: .55; }
.idcard .lock .ui-icon { width: 26px; height: 26px; }
.idcard .tag { font-size: 11px; font-weight: 800; color: var(--win); }
.idcard .found-badge { position: absolute; top: 8px; right: 10px; font-size: 15px; }
.found-btn { width: 100%; margin-top: 4px; }

.leader { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.lrow.first { border-color: var(--go); background: #1d1a3a; }
.lrow .pos { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.lrow .nm { min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; overflow: hidden; }
.lrow .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .tm { font-family: var(--display); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lrow.pending { opacity: .5; }

.timer { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--win); border-radius: 4px; transition: width .25s linear; }
.timer.low i { background: var(--hot); }
.secs { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.secs.low { color: var(--hot); }

.podium { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.podium .crown { font-size: 60px; line-height: 1; }
.podium .who { font-family: var(--display); font-size: clamp(30px, 10vw, 44px); color: var(--go); word-break: break-word; line-height: 1.05; }
.scores { display: flex; flex-direction: column; gap: 8px; }
.score { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.score .pos { font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.score .nm { font-weight: 700; min-width: 0; display: flex; align-items: center; gap: 8px; }
.score .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .gain { color: var(--win); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.score .tot { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.score .tot small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 700; text-align: right; }
.score.first { border-color: var(--go); }
.score.me { background: #231a3c; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 10px; font: 800 14px var(--body); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }

.wait-note { text-align: center; color: var(--muted); font-weight: 600; padding: 8px; }
.foot { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.react { display: flex; justify-content: center; gap: 8px; }
.react button { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 24px; width: 50px; height: 46px; cursor: pointer; }
.react button:active { transform: scale(.9); }
.floaty { position: fixed; bottom: 90px; font-size: 40px; pointer-events: none; z-index: 30; animation: floaty 2.2s ease-out forwards; }
@keyframes floaty { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translateY(-40px) scale(1.1); } 100% { transform: translateY(-60vh); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop, .floaty { animation: none; } .timer i { transition: none; } }
</style>

<div class="app">
  <div class="hdr" id="hdr" hidden>
    <span class="pill code" id="hdrCode">ABCD</span>
    <span class="pill" id="hdrRound">Sala de espera</span>
    <span class="pill off" id="hdrNet" hidden>sem conexão</span>
    <button class="pill btn-pill" id="hdrRules" type="button">Regras</button>
  </div>
  <div id="main"></div>
  <div class="foot" id="foot" hidden><button class="link" id="sair" type="button">Sair da sala</button></div>
</div>
<div class="overlay" id="rulesSheet" hidden>
  <div class="sheet">
    <div class="top"><h2>Regras</h2><button class="btn ghost small auto" id="rulesClose" type="button">Fechar</button></div>
    <div class="rules" id="rulesFull"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ================= rules & decks ================= */
const RULES_HTML = `
  <span class="label">Como joga</span>
  <ol>
    <li>No lobby, o anfitrião escolhe a categoria e todo mundo entra.</li>
    <li>Ao começar, cada jogador recebe em segredo um personagem — <b>você vê o personagem de todo mundo, menos o seu</b>.</li>
    <li>Pergunte em voz alta para a roda "sim ou não" sobre quem você é, até descobrir.</li>
    <li>Quando achar que descobriu, fale em voz alta e toque em <b>Eu descobri!</b> — vale honestidade, sem espiar.</li>
    <li>Quem descobre mais rápido fica no topo do placar. O anfitrião pode encerrar a rodada quando quiser.</li>
    <li>O <b>ranking da sala</b> guarda pontos de todas as rodadas jogadas nessa sala.</li>
  </ol>`;
const DECKS = {
  famosos: { t: "🌟 Famosos", d: "celebridades daqui", lista: ["Xuxa","Silvio Santos","Anitta","Neymar","Ronaldinho Gaúcho","Ivete Sangalo","Whindersson Nunes","Marília Mendonça","Pelé","Ayrton Senna","Gisele Bündchen","Luciano Huck","Angélica","Chico Buarque","Caetano Veloso","Gusttavo Lima","Sabrina Sato","Fátima Bernardes","Tiago Leifert","Larissa Manoela"] },
  personagens: { t: "🎬 Personagens", d: "desenhos, filmes e games", lista: ["Mario","Sonic","Pikachu","Homer Simpson","Bart Simpson","Mickey Mouse","Batman","Homem-Aranha","Shrek","Bob Esponja","Patrick Estrela","Chapolin Colorado","Chaves","Mônica","Cebolinha","Cascão","Elsa de Frozen","Harry Potter","Darth Vader","Capitão América"] },
  animais: { t: "🐾 Animais", d: "bichos de todo tipo", lista: ["Leão","Elefante","Girafa","Panda","Canguru","Pinguim","Tubarão","Águia","Coala","Macaco","Zebra","Hipopótamo","Tigre","Urso Polar","Golfinho","Camaleão","Avestruz","Morcego","Esquilo","Flamingo"] },
  mistura: { t: "🔀 Mistura", d: "um pouco de tudo", lista: null }
};
function listaDe(cat) { if (cat === "mistura") return [...DECKS.famosos.lista, ...DECKS.personagens.lista, ...DECKS.animais.lista]; return (DECKS[cat] || DECKS.famosos).lista; }
const LIMITES = { sem: { t: "Sem limite", ms: null }, "5": { t: "5 min", ms: 5 * 60000 }, "10": { t: "10 min", ms: 10 * 60000 } };
const COLORS = ["#ffd23f","#3ee6c1","#ff4d6d","#8ab4ff","#ff9f43","#c38bff","#7bed9f","#ff7eb6","#70d6ff","#e0c3a0","#b5f04a","#ffb3a7"];
const EMOJIS = ["😂","🤯","🫣","🔥","🎉"];

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function rand(n) { try { const b = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n; do crypto.getRandomValues(b); while (b[0] >= lim); return b[0] % n; } catch { return Math.floor(Math.random() * n); } }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uuid() { if (crypto.randomUUID) return crypto.randomUUID(); return [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, "0")).join(""); }
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ================= session ================= */
const CFG = window.QSE_CFG || {};
const sb = CFG.url && window.supabase ? window.supabase.createClient(CFG.url, CFG.key) : null;
let me = store.get("qse_me", null);
if (!me || !me.id) { me = { id: uuid(), nome: "" }; store.set("qse_me", me); }
let code = null, ch = null, E = null, H = null, online = new Set(), lastSeen = 0, viewKey = "", homeErr = "", abaFim = "partida";

const isHost = () => !!H;
const jog = id => (E && E.jogadores.find(j => j.id === id)) || null;
const nomeDe = id => (jog(id) || {}).nome || "Alguém";
const corDe = id => { const i = E ? E.jogadores.findIndex(j => j.id === id) : 0; return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
const av = id => `<span class="av" style="background:${corDe(id)}">${esc(nomeDe(id).trim().charAt(0).toUpperCase() || "?")}</span>`;
const ativos = () => E ? E.jogadores.filter(j => j.id === E.host || online.has(j.id)) : [];

function send(t, data) { if (ch) ch.send({ type: "broadcast", event: "m", payload: { t, ...data } }); }
function conectar(c) {
  if (ch) sb.removeChannel(ch);
  online = new Set();
  ch = sb.channel("qse-" + c, { config: { broadcast: { self: false }, presence: { key: me.id } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload || {}))
    .on("presence", { event: "sync" }, () => { online = new Set(Object.keys(ch.presenceState())); render(); if (H) hostTick(); })
    .subscribe(st => {
      if (st === "SUBSCRIBED") { $("hdrNet").hidden = true; ch.track({ nome: me.nome }); if (H) publicar(); else send("join", { id: me.id, nome: me.nome }); }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") $("hdrNet").hidden = false;
    });
}
function onMsg(m) {
  if (m.t === "estado" && !H && m.E && typeof m.E === "object") {
    if (!E || m.E.v >= E.v || m.E.sid !== E.sid) { E = m.E; lastSeen = Date.now(); render(); }
  } else if (m.t === "react" && EMOJIS.includes(m.e)) floatEmoji(m.e);
  else if (H && m.t === "join") hostJoin(m.id, m.nome);
  else if (H && m.t === "descobri") hostDescobri(m.id);
  else if (H && m.t === "hello") publicar();
}
setInterval(() => {
  if (!code || H) return;
  if (!E || !jog(me.id)) send("join", { id: me.id, nome: me.nome });
  if (E && Date.now() - lastSeen > 9000) $("hdrNet").hidden = false; else if (E) $("hdrNet").hidden = true;
}, 1500);

/* ================= host ================= */
function hostSave() { store.set("qse_host_" + code, { E: H.E }); }
function publicar() { H.E.v++; hostSave(); E = H.E; send("estado", { E: H.E }); render(); }
setInterval(() => { if (H && ch) { send("estado", { E: H.E }); hostTick(); } }, 2000);
function hostJoin(id, nome) {
  if (typeof id !== "string" || id.length > 40) return;
  nome = String(nome || "").trim().slice(0, 16) || "Alguém";
  const j = H.E.jogadores.find(j => j.id === id);
  if (j) { if (j.nome === nome) return publicar(); j.nome = nome; }
  else { if (H.E.jogadores.length >= 14 || H.E.fase !== "lobby") return; H.E.jogadores.push({ id, nome, personagem: null }); }
  publicar();
}
function comecar() {
  const e = H.E;
  e.jogadores = e.jogadores.filter(j => j.id === e.host || online.has(j.id));
  if (e.jogadores.length < 2) return;
  const baralho = shuffle(listaDe(e.categoria || "famosos")).slice(0, e.jogadores.length);
  e.jogadores.forEach((j, i) => j.personagem = baralho[i]);
  e.sid = uuid().slice(0, 8); e.fase = "jogo"; e.iniciadoEm = Date.now(); e.descobertas = {};
  e.prazo = LIMITES[e.limite || "sem"].ms ? e.iniciadoEm + LIMITES[e.limite || "sem"].ms : null;
  publicar();
}
function hostDescobri(id) {
  const e = H.E;
  if (e.fase !== "jogo" || !jog(id) || e.descobertas[id]) return;
  const ordem = Object.keys(e.descobertas).length + 1;
  e.descobertas[id] = { ordem, tempo: Date.now() - e.iniciadoEm };
  publicar();
  toastBroadcast(`${nomeDe(id)} descobriu quem era!`);
  if (ativos().every(j => e.descobertas[j.id])) encerrarJogo();
}
function toastBroadcast(msg) { send("toast", { m: msg }); toast(msg); }
function encerrarJogo() {
  const e = H.E;
  e.fase = "fim"; e.prazo = null;
  const rk = ranking();
  const top = rk[0];
  for (const j of e.jogadores) {
    const s = e.sala[j.id] = e.sala[j.id] || { nome: j.nome, pontos: 0, vitorias: 0, jogos: 0 };
    s.nome = j.nome; s.jogos++;
    const pos = rk.indexOf(j.id);
    const pts = e.descobertas[j.id] ? Math.max(1, e.jogadores.length - e.descobertas[j.id].ordem + 1) : 0;
    s.pontos += pts;
    if (top === j.id && e.descobertas[j.id]) s.vitorias++;
  }
  publicar();
}
function denovo() {
  const e = H.E;
  e.fase = "lobby"; e.jogadores.forEach(j => j.personagem = null); e.descobertas = {}; e.prazo = null; abaFim = "partida";
  publicar();
}
function hostTick() {
  if (!H) return;
  const e = H.E;
  if (e.fase === "jogo" && e.prazo && Date.now() > e.prazo) encerrarJogo();
}

/* ================= ranking ================= */
function ranking() {
  if (!E) return [];
  const ativosIds = ativos().map(j => j.id);
  return ativosIds.slice().sort((a, b) => {
    const da = E.descobertas[a], db = E.descobertas[b];
    if (da && db) return da.ordem - db.ordem;
    if (da) return -1; if (db) return 1;
    return 0;
  });
}

/* ================= actions ================= */
function descobrir() {
  if (!E || E.fase !== "jogo" || E.descobertas[me.id]) return;
  if (navigator.vibrate) navigator.vibrate(25);
  if (H) hostDescobri(me.id); else send("descobri", { id: me.id });
}
function codigoNovo() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({ length: 4 }, () => L[rand(L.length)]).join(""); }
function entrarComo(c, host) {
  code = c; store.set("qse_sala", { code: c, host });
  history.replaceState(null, "", "?sala=" + c);
  if (host) {
    const salvo = store.get("qse_host_" + c, null);
    H = salvo && salvo.E ? salvo : { E: { v: 0, sid: uuid().slice(0, 8), host: me.id, fase: "lobby", categoria: "famosos", limite: "sem", jogadores: [{ id: me.id, nome: me.nome, personagem: null }], descobertas: {}, sala: {} } };
    const eu = H.E.jogadores.find(j => j.id === me.id); if (eu) eu.nome = me.nome;
    E = H.E;
  } else { H = null; E = null; }
  lastSeen = Date.now();
  conectar(c); render();
  if (!host) setTimeout(() => { if (code === c && !E) { sair(); erroHome(`Não achei a sala ${c}. Confira o código e se quem criou está com o jogo aberto.`); } }, 9000);
}
function sair() {
  if (ch) sb.removeChannel(ch);
  ch = null; code = null; E = null; H = null;
  store.del("qse_sala"); history.replaceState(null, "", location.pathname);
  viewKey = ""; render();
}
$("sair").onclick = sair;
function erroHome(m) { homeErr = m; viewKey = ""; render(); }

/* ================= render ================= */
function render() {
  const inRoom = !!code;
  $("hdr").hidden = !inRoom || !E; $("foot").hidden = !inRoom;
  if (!inRoom) return paint("home", viewHome);
  if (!E) return paint("wait", () => `<div class="block" style="align-items:center;text-align:center"><h2>Entrando na sala ${esc(code)}…</h2><p class="muted">Quem criou a sala precisa estar com o jogo aberto.</p></div>`);
  $("hdrCode").textContent = code;
  $("hdrRound").textContent = E.fase === "lobby" ? "Sala de espera" : E.fase === "fim" ? "Fim de rodada" : "Descobrindo…";
  if (E.fase === "lobby") return paint("lobby|" + E.v + "|" + [...online].sort().join(","), viewLobby);
  if (E.fase === "jogo") return paint("jogo|" + E.v, viewJogo);
  if (E.fase === "fim") return paint("fim|" + E.v + "|" + abaFim, viewFim);
}
function paint(key, fn) {
  if (key === viewKey) return;
  viewKey = key;
  $("main").innerHTML = fn();
  bind();
}
function viewHome() {
  const salaUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
  return `
  <div class="block"><span class="label">Jogo de adivinhação</span><h1>Quem <span class="t">Sou Eu</span></h1>
  <p class="muted">Todo mundo vê quem você é, menos você. Pergunte, deduza e descubra sua identidade antes da galera.</p></div>
  <div class="rules">${RULES_HTML}</div>
  <div class="field"><label class="label" for="nome">Seu nome</label><input class="input" id="nome" maxlength="16" autocomplete="nickname" placeholder="Como te chamam?" value="${esc(me.nome || "")}"></div>
  <div class="field"><label class="label" for="codigo">Entrar numa sala</label>
    <div class="join-row"><input class="input code" id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${/^[A-Z]{4}$/.test(salaUrl) ? salaUrl : ""}"><button class="btn go auto" id="entrar" type="button">Entrar</button></div></div>
  <button class="btn ghost" id="criar" type="button">Criar sala nova</button>
  ${homeErr ? `<p class="muted" style="color:var(--hot)">${esc(homeErr)}</p>` : ""}
  ${!sb ? `<p class="muted" style="color:var(--hot)">O jogo está sem conexão com o servidor.</p>` : ""}`;
}
function rankingSalaHTML() {
  const linhas = Object.entries(E.sala || {}).sort((a, b) => b[1].vitorias - a[1].vitorias || b[1].pontos - a[1].pontos);
  if (!linhas.length) return `<p class="muted">Ninguém terminou uma rodada nessa sala ainda.</p>`;
  return `<div class="scores">${linhas.map(([id, s], i) => `<div class="score ${i === 0 ? "first" : ""} ${id === me.id ? "me" : ""}"><span class="pos">${i + 1}º</span><span class="nm">${av(id)}<span>${esc(s.nome)}</span></span><span class="gain">🏆 ${s.vitorias}</span><span class="tot">${s.pontos}<small>${s.jogos} ${s.jogos === 1 ? "rodada" : "rodadas"}</small></span></div>`).join("")}</div>`;
}
function viewLobby() {
  const host = isHost(), at = ativos();
  return `
  <div class="block" style="align-items:center;text-align:center"><span class="label">Código da sala</span><div class="roomcode">${esc(code)}</div>
  <button class="btn ghost small auto" id="share" type="button">Chamar a galera</button></div>
  <div class="block"><span class="label">Jogadores (${at.length})</span><div class="players">${E.jogadores.map(j => `<span class="player ${j.id === E.host || online.has(j.id) ? "" : "away"}">${av(j.id)}<span class="nm">${esc(j.nome)}${j.id === me.id ? " (você)" : ""}${j.id === E.host ? " 👑" : ""}</span></span>`).join("")}</div></div>
  <div class="block"><span class="label">Categoria</span><div class="chips">${Object.entries(DECKS).map(([k, c]) => `<button type="button" class="chip" data-cat="${k}" aria-pressed="${(E.categoria || "famosos") === k}" ${host ? "" : "disabled"}>${c.t}<small>${c.d}</small></button>`).join("")}</div></div>
  <div class="block"><span class="label">Tempo da rodada</span><div class="chips">${Object.entries(LIMITES).map(([k, l]) => `<button type="button" class="chip" data-lim="${k}" aria-pressed="${(E.limite || "sem") === k}" ${host ? "" : "disabled"}>${l.t}</button>`).join("")}</div></div>
  <div class="block"><span class="label">Ranking da sala</span>${rankingSalaHTML()}</div>
  <div class="grow">${host ? `<button class="btn go" id="comecar" type="button" ${at.length < 2 ? "disabled" : ""}>Começar rodada</button>${at.length < 2 ? `<p class="muted" style="text-align:center">Precisa de pelo menos 2 jogadores.</p>` : ""}` : `<p class="wait-note">Esperando ${esc(nomeDe(E.host))} começar…</p>`}</div>`;
}
function viewJogo() {
  const at = ativos(), rk = ranking(), meuDesc = E.descobertas[me.id];
  const deck = at.map(j => {
    const souEu = j.id === me.id;
    const achou = !!E.descobertas[j.id];
    if (souEu) {
      return `<div class="idcard me ${meuDesc ? "found" : ""} pop"><span class="who">Você</span>
        ${meuDesc ? `<div class="nome">${esc(j.personagem)}</div><span class="tag">✓ Descoberto</span>` : `<div class="lock">${wavvyIcon("eye-off")}</div><div class="nome">???</div><button class="btn go small found-btn" id="descobri" type="button">Eu descobri!</button>`}</div>`;
    }
    return `<div class="idcard"><span class="who">${esc(j.nome)}</span><div class="nome">${esc(j.personagem)}</div>${achou ? `<span class="found-badge" title="já descobriu quem é">✅</span>` : ""}</div>`;
  }).join("");
  const limiteAtivo = LIMITES[E.limite || "sem"].ms;
  return `
  ${limiteAtivo ? `<div class="top"><span class="label">Tempo restante</span><span class="secs" id="secs"></span></div><div class="timer" id="timer"><i></i></div>` : ""}
  <div class="block"><span class="label">Cartas da sala</span><div class="deck">${deck}</div></div>
  <div class="block"><span class="label">Quem já descobriu</span><div class="leader">${rk.map((id, i) => {
    const d = E.descobertas[id];
    return `<div class="lrow ${d && d.ordem === 1 ? "first" : ""} ${d ? "" : "pending"}"><span class="pos">${d ? d.ordem + "º" : "—"}</span><span class="nm">${av(id)}<span>${esc(nomeDe(id))}${id === me.id ? " (você)" : ""}</span></span><span class="tm">${d ? Math.round(d.tempo / 1000) + "s" : "pensando…"}</span></div>`;
  }).join("")}</div></div>
  ${isHost() ? `<button class="btn ghost small" id="encerrar" type="button">Encerrar rodada agora</button>` : ""}`;
}
function viewFim() {
  const rk = ranking(), vencedor = rk.find(id => E.descobertas[id]);
  setTimeout(confetti, 300);
  return `<div class="podium pop"><div class="crown">🏆</div><span class="label">Mais rápido a se descobrir</span><div class="who">${vencedor ? esc(nomeDe(vencedor)) : "Ninguém descobriu"}</div>
    ${vencedor ? `<p class="muted">em ${Math.round(E.descobertas[vencedor].tempo / 1000)} segundos</p>` : ""}</div>
    <div class="block"><span class="label">Revelação completa</span><div class="scores">${rk.map((id, i) => {
      const d = E.descobertas[id];
      return `<div class="score ${i === 0 && d ? "first" : ""} ${id === me.id ? "me" : ""}"><span class="pos">${d ? d.ordem + "º" : "—"}</span><span class="nm">${av(id)}<span>${esc(nomeDe(id))} era <b>${esc(jog(id).personagem)}</b></span></span><span class="gain"></span><span class="tot">${d ? Math.round(d.tempo / 1000) + "s" : "não descobriu"}</span></div>`;
    }).join("")}</div></div>
    <div class="react">${EMOJIS.map(e => `<button type="button" data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>
    <div class="tabs"><button type="button" data-aba="partida" aria-pressed="${abaFim === "partida"}">Esta rodada</button><button type="button" data-aba="sala" aria-pressed="${abaFim === "sala"}">Ranking da sala</button></div>
    ${abaFim === "sala" ? rankingSalaHTML() : ""}
    <div class="grow">${isHost() ? `<button class="btn go" id="denovo" type="button">Jogar de novo</button>` : `<p class="wait-note">${esc(nomeDe(E.host))} pode começar outra rodada.</p>`}</div>`;
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const pegaNome = () => { const n = ($("nome").value || "").trim(); if (!n) { erroHome("Escreva seu nome antes."); return null; } me.nome = n.slice(0, 16); store.set("qse_me", me); homeErr = ""; return n; };
  on("criar", () => { if (!sb || !pegaNome()) return; entrarComo(codigoNovo(), true); });
  on("entrar", () => {
    if (!sb || !pegaNome()) return;
    const c = ($("codigo").value || "").trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(c)) return erroHome("O código tem 4 letras.");
    entrarComo(c, false);
  });
  const ci = $("codigo"); if (ci) ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z]/g, ""); };
  on("share", async () => {
    const url = location.origin + location.pathname + "?sala=" + code, text = `Bora jogar Quem Sou Eu! Sala ${code}`;
    try { if (navigator.share) { await navigator.share({ title: "Quem Sou Eu", text, url }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(`${text}: ${url}`); toast("Link copiado. Manda no grupo!"); } catch { toast(url); }
  });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { if (H) { H.E.categoria = b.dataset.cat; publicar(); } });
  document.querySelectorAll("[data-lim]").forEach(b => b.onclick = () => { if (H) { H.E.limite = b.dataset.lim; publicar(); } });
  document.querySelectorAll("[data-aba]").forEach(b => b.onclick = () => { abaFim = b.dataset.aba; viewKey = ""; render(); });
  on("comecar", () => H && comecar());
  on("encerrar", () => H && H.E.fase === "jogo" && encerrarJogo());
  on("denovo", () => H && denovo());
  on("descobri", descobrir);
  document.querySelectorAll("[data-react]").forEach(b => b.onclick = () => { floatEmoji(b.dataset.react); send("react", { e: b.dataset.react }); });
}

/* clock: round time limit countdown */
setInterval(() => {
  if (!E || E.fase !== "jogo" || !E.prazo) return;
  const left = Math.max(0, E.prazo - Date.now()), total = LIMITES[E.limite || "sem"].ms || 1, low = left < 15000;
  const bar = $("timer"), secs = $("secs");
  if (bar) { bar.firstElementChild.style.width = Math.min(100, left / total * 100) + "%"; bar.classList.toggle("low", low); }
  if (secs) { const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); secs.textContent = m + ":" + String(s).padStart(2, "0"); secs.classList.toggle("low", low); }
  if (left === 0 && H) hostTick();
}, 250);

function floatEmoji(e) { const d = document.createElement("div"); d.className = "floaty"; d.textContent = e; d.style.left = (10 + Math.random() * 75) + "%"; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  cv.hidden = false;
  const ps = Array.from({ length: 150 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: Hh * .3, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, c: COLORS[rand(COLORS.length)] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, W, Hh);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 2800) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, Hh); cv.hidden = true; }
  })(t0);
}
let lock = null;
async function wakeLock() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wakeLock(); if (code && !H) send("hello", {}); } });
document.addEventListener("click", wakeLock, { once: true });
$("rulesFull").innerHTML = RULES_HTML;
$("hdrRules").onclick = () => $("rulesSheet").hidden = false;
$("rulesClose").onclick = () => $("rulesSheet").hidden = true;
$("rulesSheet").onclick = e => { if (e.target.id === "rulesSheet") $("rulesSheet").hidden = true; };

const originalOnMsg = onMsg;
onMsg = function (m) { if (m.t === "toast" && m.m) toast(m.m); originalOnMsg(m); };

const salva = store.get("qse_sala", null);
const daUrl = (new URLSearchParams(location.search).get("sala") || "").toUpperCase();
if (sb && salva && salva.code && me.nome && (!daUrl || daUrl === salva.code)) entrarComo(salva.code, salva.host);
else render();
</script>
